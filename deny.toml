[graph]
targets = []
all-features = true
exclude = ["grc-controls-apis", "grc-controls-models"]

[advisories]
ignore = [
    # RISK ACCEPTANCE: RUSTSEC-2024-0436 (paste v1.0.15 — unmaintained)
    # Advisory type: unmaintained (warning, not a vulnerability)
    # Impact: paste is a compile-time proc-macro only; it generates code at build time and
    #   ships no runtime code in the final binary. No attack surface in production.
    # Root cause: paste is a transitive dependency of cel-interpreter v0.10.0 (latest available).
    #   We cannot eliminate it without replacing our CEL engine.
    # Mitigation: paste v1.0.15 by dtolnay is functionally complete and widely depended upon
    #   (14k+ dependents on crates.io). The "unmaintained" status reflects the author stepping
    #   back, not a known defect. No CVEs or security issues have been filed against paste.
    # Review cadence: Re-evaluate when cel-interpreter publishes a new major version.
    # Accepted: 2026-04-29 by CTO
    { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro only, no runtime attack surface; transitive via cel-interpreter 0.10.0 (latest). Functionally complete, no known CVEs." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
