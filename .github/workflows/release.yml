name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # -------------------------------------------------------------------------
  # Build multi-platform binaries
  # -------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64 — musl for maximum portability
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: false
            binary: ocean

          # Linux arm64 — cross-compile via cross
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
            binary: ocean

          # macOS Intel (macos-13 is x86_64)
          - name: darwin-amd64
            os: macos-13
            target: x86_64-apple-darwin
            use_cross: false
            binary: ocean

          # macOS Apple Silicon (macos-latest is arm64)
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            binary: ocean

          # Windows amd64
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            binary: ocean.exe

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install musl-tools (linux-amd64)
        if: matrix.name == 'linux-amd64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install cross (linux-arm64)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.use_cross
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cross build --release --target "$BUILD_TARGET"

      - name: Build with cargo
        if: "!matrix.use_cross"
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --release --target "$BUILD_TARGET"

      - name: Package binary (Unix)
        if: matrix.name != 'windows-amd64'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_BINARY: ${{ matrix.binary }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSET="ocean-${TAG}-${MATRIX_NAME}.tar.gz"
          cp "target/${BUILD_TARGET}/release/${MATRIX_BINARY}" ocean
          tar -czf "${ASSET}" ocean
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Package binary (Windows)
        if: matrix.name == 'windows-amd64'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          MATRIX_BINARY: ${{ matrix.binary }}
        shell: pwsh
        run: |
          $TAG = $env:GITHUB_REF_NAME
          $ASSET = "ocean-${TAG}-windows-amd64.zip"
          $BuildTarget = $env:BUILD_TARGET
          $MatrixBinary = $env:MATRIX_BINARY
          Copy-Item "target/$BuildTarget/release/$MatrixBinary" ocean.exe
          Compress-Archive -Path ocean.exe -DestinationPath $ASSET
          "ASSET=$ASSET" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compute checksum (Unix)
        if: matrix.name != 'windows-amd64'
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - name: Compute checksum (Windows)
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $hash = Get-FileHash $env:ASSET -Algorithm SHA256
          "$($hash.Hash.ToLower())  $env:ASSET" | Out-File "$env:ASSET.sha256" -Encoding utf8

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # SBOM Generation (GRC-79)
  # -------------------------------------------------------------------------
  sbom:
    name: Generate SBOM
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --output-file ocean-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: ocean-sbom.cdx.json
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # Docker image
  # -------------------------------------------------------------------------
  docker:
    name: Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # Create GitHub Release
  # -------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [build, sbom, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: true

      # ----- Cosign Signing (GRC-81) -----
      - name: Install cosign
        uses: sigstore/cosign-installer@c56c2d3e59e4281cc41dea2217323ba5694b171e # v3.8.0

      - name: Sign release artifacts
        shell: bash
        run: |
          for file in artifacts/*; do
            if [ -f "$file" ] && [[ ! "$file" == *.sig ]]; then
              cosign sign-blob --yes --output-signature "${file}.sig" "$file"
            fi
          done

      - name: Upload signatures to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*.sig
          fail_on_unmatched_files: false

      - name: Sign Docker image
        env:
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: cosign sign --yes "ghcr.io/${REPO}:${TAG_NAME#v}"

      # ----- Compute artifact hashes for provenance -----
      - name: Compute artifact hashes
        id: hash
        shell: bash
        run: |
          cd artifacts
          sha256sum * | grep -v '\.sig$' > ../hashes.txt
          HASHES=$(cat ../hashes.txt | base64 -w0)
          echo "hashes=${HASHES}" >> "$GITHUB_OUTPUT"

    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

  # -------------------------------------------------------------------------
  # SLSA Provenance (GRC-82)
  # -------------------------------------------------------------------------
  provenance:
    name: SLSA Provenance
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
