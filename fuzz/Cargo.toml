[package]
name = "ocean-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ocean = { path = ".." }
serde_yaml = "0.9"
serde_json = "1"
cel-interpreter = "0.8"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_yaml_manifest"
path = "fuzz_targets/fuzz_yaml_manifest.rs"
doc = false

[[bin]]
name = "fuzz_check_loader"
path = "fuzz_targets/fuzz_check_loader.rs"
doc = false

[[bin]]
name = "fuzz_cel_eval"
path = "fuzz_targets/fuzz_cel_eval.rs"
doc = false
