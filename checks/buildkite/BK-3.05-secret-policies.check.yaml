id: BK-3.05
name: Cluster Secrets Carry an Access Policy
description: |
  Verifies that every Buildkite cluster secret declares a non-empty access
  policy. A cluster secret without a policy is readable by ANY build running
  on ANY agent in that cluster — the policy is the entire difference between
  "any build in the prod cluster can read the deploy key" and "only the deploy
  pipeline, on main, can read the deploy key". Cluster scoping alone is a
  coarse boundary; the YAML policy is the fine one.

  Scope and known limits, stated plainly:

  - SINGLE CLUSTER PER RUN. The secrets endpoint is cluster-scoped and the
    check interpreter cannot iterate: `jsonpath_extract` has no index form
    (`$[0].id` is unsupported) and array extractions never reach the string
    template context, so a discovered cluster ID can never be substituted
    into a later URL. `cluster` must therefore be supplied explicitly and
    this check run once per cluster. Step `list_clusters` exists only to
    record the full cluster inventory as evidence so a reviewer can see which
    clusters were NOT covered by this run.
  - FLEET EXECUTION CANNOT SUPPLY `cluster` TODAY. Fleet runs pass only a
    target's allowlisted credential map as module config
    (`src/fleet/executor.rs`, `allowed_credentials("buildkite")`), and
    BUILDKITE_CLUSTER_ID is not on that allowlist. Direct CLI execution reads
    the whole process environment and resolves it normally.
  - VACUOUS PASS ON AN EMPTY CLUSTER. A cluster with zero secrets passes:
    there is nothing to police. Read `secret_count` alongside the verdict.
  - DEGRADES, DOES NOT ACCUSE. If the secrets endpoint is unreachable (token
    missing `read_secrets_details`, wrong cluster ID, plan gate), the
    reachability assertion fails loudly and the policy assertion abstains
    rather than reporting a coverage gap as a policy violation.

  Authored from Buildkite's REST secrets documentation and the verified
  Terraform provider v1.38.0 schema (`buildkite_cluster_secret.policy`,
  a YAML string). Not executed against a live tenant — the reference tenant
  holds one cluster and zero secrets.
author: grc-engineering
version: "1.0"
source: buildkite
profile: L2
tags: [secrets, clusters, least-privilege, cicd]

references:
  cis: "3.11"
  nist: [SC-12, SC-28]
  soc2: CC6.7
  hth: "buildkite:3.5"

credentials:
  BUILDKITE_API_TOKEN:
    type: api_token
    scopes: [read_clusters, read_secrets_details]
    required: true

inputs:
  org:
    description: Buildkite organization slug
    env: BUILDKITE_ORG_SLUG
    required: true
  cluster:
    description: >-
      UUID of the cluster whose secrets are audited. Must be supplied
      explicitly — the interpreter cannot discover it (no index JSONPath, and
      array extractions never enter the template context). Run this check once
      per cluster; `list_clusters` records the full inventory as evidence.
    env: BUILDKITE_CLUSTER_ID
    required: true

steps:
  - id: list_clusters
    action: api_call
    note: >-
      Inventory only. Recorded so a reviewer can see every cluster that exists
      and confirm which ones this run did not cover. Its values cannot be fed
      into the secrets URL below.
    request:
      method: GET
      url: "https://api.buildkite.com/v2/organizations/{{org}}/clusters"
      headers:
        Authorization: "Bearer {{BUILDKITE_API_TOKEN}}"
        Accept: application/json
    extract:
      cluster_ids: "$[*].id"
      cluster_names: "$[*].name"
      cluster_count: "$length"

  - id: get_secrets
    action: api_call
    request:
      method: GET
      url: "https://api.buildkite.com/v2/organizations/{{org}}/clusters/{{cluster}}/secrets"
      headers:
        Authorization: "Bearer {{BUILDKITE_API_TOKEN}}"
        Accept: application/json
    extract:
      secrets: "$[*]"
      secret_keys: "$[*].key"
      secret_count: "$length"

assertions:
  - id: secrets_api_reachable
    expr: "get_secrets_status_code == 200"
    severity: medium
    title: Cluster Secret Inventory Retrieved
    pass_message: "Secret inventory retrieved for cluster {{cluster}} in organization {{org}}"
    fail_message: "The secret inventory for cluster {{cluster}} could not be retrieved — this run proves nothing about that cluster's secrets"
    finding:
      description: |
        The cluster secrets endpoint did not return 200, so this run carries no
        evidence about secret access policies on this cluster. Treat it as a
        coverage gap, not as a pass.

        Common causes, in order of likelihood:
        - The API access token lacks the `read_secrets_details` scope (and
          `read_clusters` for the inventory step).
        - BUILDKITE_CLUSTER_ID is not a cluster UUID for this organization.
          Compare it against the `cluster_ids` extraction captured by the
          `list_clusters` step. Read it on the evidence record's `raw_data`,
          not in `observables`: `cluster_ids` is a `$[*]` array, and the YAML
          interpreter exports an extraction as an observable only when it is a
          JSON scalar, so of that step only `cluster_count` appears there.
        - The run executed through a fleet manifest, which passes only the
          allowlisted credential names as module config and therefore cannot
          deliver BUILDKITE_CLUSTER_ID today.

        Resolve the cause and re-run before drawing any conclusion about this
        cluster.

  - id: every_secret_has_policy
    expr: 'get_secrets_status_code != 200 || size(secrets.filter(s, !has(s.policy) || s.policy == null || s.policy == "")) == 0'
    severity: high
    title: Every Cluster Secret Declares an Access Policy
    pass_message: "No policy-less secret was observed on cluster {{cluster}} — this row is evidence that every secret declares a non-empty access policy ONLY if 'Cluster Secret Inventory Retrieved' above also passed; when the secret list could not be read it abstains and asserts nothing about any secret. The number of secrets actually read, if any, is the secret_count observable in this check's evidence"
    fail_message: "One or more secrets on cluster {{cluster}} have no access policy and are readable by every build in the cluster"
    finding:
      description: |
        At least one cluster secret has an absent or empty `policy`. Without a
        policy, the secret is not scoped to any pipeline or branch — every
        build that runs on any agent in this cluster can read it. That collapses
        the fine-grained control down to the cluster boundary alone, so a
        low-trust pipeline sharing the cluster inherits production credentials.

        The concrete consequence: an attacker who can land a commit on any
        branch of any pipeline scheduled to this cluster gets the unscoped
        secret, without needing to touch the pipeline that legitimately uses it.

        Attach a YAML access policy to each unscoped secret naming the specific
        pipelines and branches permitted to read it, then rotate the values that
        were exposed while unscoped. Do not treat the cluster boundary as a
        substitute for a policy.

        This assertion abstains when the secrets endpoint is unreachable; the
        `secrets_api_reachable` assertion carries that signal instead.

remediation:
  description: |
    Attach a least-privilege YAML access policy to every cluster secret, then
    rotate any secret that was readable without one. Scope each policy to the
    narrowest pipeline and branch pair the workflow actually needs, and keep
    production secrets on the production cluster only so a development agent
    has no path to them.
  steps:
    - "Open Buildkite → Clusters → the affected cluster → Secrets"
    - "For each secret with no policy, open it and add a YAML access policy naming the specific pipelines and branches allowed to read it"
    - "Rotate the value of every secret that existed without a policy — treat it as exposed to every build that ran on the cluster"
    - "Confirm production secrets live only on the production cluster, not on a shared or development cluster"
    - "Review cluster secrets alongside that cluster's agent tokens — together they define what a compromised agent can reach"
  manual:
    - "Where an external secret manager (Vault, AWS Secrets Manager, GCP Secret Manager) is already in use, prefer retrieving at job time over storing the secret in Buildkite at all"
    - "Never place a secret in a pipeline env block or step configuration — Buildkite returns pipeline settings in REST and GraphQL payloads, so a secret there is exposed to every token that can read the pipeline"
    - "Add cluster secrets and their policies to the same access-review cadence as cluster agent tokens"
  terraform:
    resources:
      - type: buildkite_cluster_secret
        name: deploy_key
        attributes:
          cluster_id: "<cluster uuid>"
          key: DEPLOY_KEY
          description: "Deploy key, scoped to the deploy pipeline on main"
          value_wo: "<from your secret manager>"
          value_wo_version: "<secret manager version id>"
          policy: |
            pipelines:
              - deploy
            branches:
              - main
