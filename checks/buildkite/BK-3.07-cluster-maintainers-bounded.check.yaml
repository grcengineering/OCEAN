id: BK-3.07
name: Cluster Maintainer List Is Bounded
description: |
  Reads the maintainer list of a Buildkite agent cluster via the REST API
  (GET /v2/organizations/{org}/clusters/{cluster}/maintainers) and fails when
  more than 3 maintainers are assigned.

  Why this matters more than a maintainer count usually would. Cluster
  maintainers hold authority over that cluster's agent tokens, its queues,
  AND its cluster secrets. An unmanaged maintainer list is therefore
  equivalent to an unmanaged list of people who can read production
  credentials and register agents into the pool that runs privileged builds —
  it silently undoes the isolation boundary the cluster was created to
  establish (BK-3.02). Maintainer grants are also invisible from the
  organization member list, so an access review that only reads org roles
  will miss them entirely; this check is the compensating read.

  Why REST and not GraphQL. The maintainer list is list-shaped. OCEAN's
  `jsonpath_extract` supports the `$[*]` / `$length` forms only at the root
  of the response array, and a GraphQL response is a nested object, so no
  nested Relay traversal of a maintainers connection can be expressed. REST
  returns a root array, which the interpreter can measure directly.

  VERIFICATION STATUS — READ THIS BEFORE TRUSTING A PASS. The endpoint path
  used here (/v2/organizations/{org}/clusters/{cluster}/maintainers) is
  schema-derived and binary-extracted plus vendor-documented; it was NOT
  round-tripped against a live tenant during the Buildkite reconciliation
  that produced this check. The response is expected to be a root array, and
  the assertions are written to fail loudly rather than pass quietly if it is
  not: the reachability assertion requires an explicit 200, and the bound
  assertion is guarded on that same status so a 404 (wrong cluster UUID), a
  403 (missing `read_clusters` scope), or any non-array error body cannot be
  scored as a compliant, bounded maintainer list. Treat a first green run as
  DRIFT-CHECKED-ONLY until the response has been observed against a real
  cluster.

  Bound configuration. The bound is the `max_maintainers` input (default 3)
  and it is the threshold ACTUALLY ENFORCED — `maintainer_count_within_bound`
  compares against the input by name. The interpreter resolves it from
  BUILDKITE_MAX_MAINTAINERS, falls back to the declared default, coerces it to
  a number and binds it into the CEL context alongside the JSONPath
  extractions. Changing the bound is a single change in a single place.

  Scope note for reviewers. A count of 0 passes this check, and that is
  correct — a cluster nobody has been delegated is not a sprawl finding. It
  is, however, the state in which people are most likely to be holding
  organization admin purely to operate the cluster, which is exactly what
  BK-2.03 measures from the other side. Read the two together.
author: grc-engineering
version: "1.0"
source: buildkite
profile: L2
tags: [clusters, maintainers, least-privilege, delegation, secrets, agent-tokens]

references:
  cis: "5.4"
  nist: ["AC-5", "AC-6(1)"]
  hth: "buildkite:3.7"

credentials:
  BUILDKITE_API_TOKEN:
    type: api_token
    scopes: [read_clusters]
    required: true

inputs:
  org:
    description: Buildkite organization slug
    env: BUILDKITE_ORG_SLUG
    required: true
  cluster:
    description: >-
      UUID of the agent cluster whose maintainer list is being evaluated. One
      cluster per run — the REST maintainers endpoint is per-cluster and the
      interpreter cannot fan a step out over a list of clusters. Read from
      BUILDKITE_CLUSTER_ID, the same variable BK-3.01a, BK-3.01b and BK-3.05
      use for the same `cluster` input: the value is the REST `id` field of the
      cluster, which is a UUID, and one input must not have two env-var names.
    env: BUILDKITE_CLUSTER_ID
    required: true
  max_maintainers:
    description: >-
      Maximum number of maintainers permitted on a single cluster. This is the
      enforced value: `maintainer_count_within_bound` compares against
      `max_maintainers` directly. Override per-tenant with
      BUILDKITE_MAX_MAINTAINERS.
    env: BUILDKITE_MAX_MAINTAINERS
    default: "3"
    required: false

steps:
  - id: list_maintainers
    action: api_call
    note: |
      Expected to be a root-array response; `$length` is used rather than a
      per-element extraction because the element shape of this endpoint has
      not been round-tripped against a live tenant. Note the fail-open
      hazard this guards against: `$length` returns 1 for any NON-array body,
      so an error payload would otherwise read as "1 maintainer" and pass the
      bound. That is why the bound assertion is guarded on an explicit 200.
      per_page is set to the API maximum because Link-header pagination is
      not yet implemented in the interpreter (the paginate flag currently
      returns the first page only).
    request:
      method: GET
      url: "https://api.buildkite.com/v2/organizations/{{org}}/clusters/{{cluster}}/maintainers?per_page=100"
      headers:
        Authorization: "Bearer {{BUILDKITE_API_TOKEN}}"
        Accept: application/json
      paginate: true
    extract:
      maintainer_count: "$length"

assertions:
  - id: maintainers_api_reachable
    expr: "list_maintainers_status_code == 200"
    severity: medium
    title: Cluster Maintainer Inventory Reachable
    pass_message: "GET /v2/organizations/{{org}}/clusters/{{cluster}}/maintainers returned 200 — the maintainer list is auditable"
    fail_message: "GET /v2/organizations/{{org}}/clusters/{{cluster}}/maintainers did not return 200 — the maintainer list could not be audited"
    finding:
      description: |
        The cluster maintainers endpoint did not return a successful
        response, so the size of the maintainer list could not be determined.
        This is an audit-coverage failure, not evidence of maintainer sprawl,
        and it is deliberately reported separately so that a plan, scope, or
        identifier problem is never presented as a compliance failure.

        Check, in order: that BUILDKITE_CLUSTER_ID is the cluster's UUID
        (not its GraphQL node ID and not its name), that the organization
        slug is correct, and that the API access token carries the
        `read_clusters` scope. Note also that this endpoint has not been
        round-tripped against a live tenant — if the path itself has moved,
        this assertion is where that will surface. Until it returns 200 the
        bound assertion below is vacuous by design and must not be read as a
        pass.

  - id: maintainer_count_within_bound
    expr: "list_maintainers_status_code != 200 || maintainer_count <= max_maintainers"
    severity: medium
    title: Cluster Maintainer Count Is Within Bound
    pass_message: "No maintainer-count violation was observed for cluster {{cluster}} — this row is evidence that at most {{max_maintainers}} maintainers are assigned ONLY if 'Cluster Maintainer Inventory Reachable' above also passed; when the maintainer list could not be read it abstains and asserts nothing about the maintainer population"
    fail_message: "More than {{max_maintainers}} maintainers are assigned to this cluster"
    finding:
      description: |
        This agent cluster has more maintainers than the configured bound.
        Cluster maintainers can create and revoke the cluster's agent
        registration tokens, change its queues, and read and write its
        cluster secrets — so the maintainer list is, in practice, the list of
        people who can read the credentials this cluster's builds use and who
        can register new agents into the pool that runs them.

        Two properties make an oversized list worse than the equivalent
        org-role sprawl. First, maintainer grants do not appear in the
        organization member list, so a quarterly review of org roles will not
        see them. Second, the set of people who need to operate a cluster
        changes faster than the set who should administer the organization,
        so grants made for a specific incident or migration persist long
        after the reason has passed.

        Reduce the list to the smallest set with a current operational need,
        and prefer assigning maintainership to a TEAM rather than to named
        individuals: team membership is already reviewed by the existing
        joiner/leaver process, whereas a per-user maintainer grant is a second
        list nobody remembers to prune.

remediation:
  description: |
    Prune the maintainer list to the smallest set with a current operational
    need, and convert individual grants to team grants so membership changes
    flow through the process that already exists instead of through a list
    that is never reviewed.
  steps:
    - "Open buildkite.com/organizations/{org}/clusters, select the cluster, and open its Maintainers list"
    - "Record for each entry whether it is a user or a team, and whether the operational need that justified it is still current"
    - "Remove every maintainer whose need has passed"
    - "For each remaining individual maintainer, check whether an existing team covers the same people; if so, add the team as maintainer and remove the individual grants"
    - "Cross-check BK-2.03: anyone who was granted organization admin in order to operate this cluster should now be demoted to member, since maintainership supplies the narrower authority they actually needed"
  manual:
    - "The maintainer write path was not round-tripped during reconciliation. Manage maintainers through the console or through Terraform (buildkite_cluster_maintainer) rather than through an unverified REST call — the resource takes cluster_uuid plus exactly ONE of user_uuid or team_uuid, and actor_type/actor_email/actor_name/actor_slug/actor_uuid are all computed, so setting them fails."
    - "Run this check once per cluster. The endpoint is per-cluster and the interpreter cannot iterate a list of cluster UUIDs within one check, so multi-cluster organizations need one target per cluster."
    - "Re-run on a schedule: a maintainer added in the console produces no drift signal anywhere else, and does not appear in any organization-level member or role listing."
  terraform:
    resources:
      - type: buildkite_cluster_maintainer
        name: example_team_maintainer
        attributes:
          cluster_uuid: "{{BUILDKITE_CLUSTER_ID}}"
          team_uuid: "REPLACE_WITH_TEAM_UUID"
