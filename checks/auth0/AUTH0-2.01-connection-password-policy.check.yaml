id: AUTH0-2.01
name: Verify Database Connections Enforce a Strong Password Policy
description: |
  Verifies that every database (auth0-strategy) connection has a
  password_policy of "good" or "excellent" and has brute_force_protection
  enabled, so weak passwords and unlimited guessing are not permitted on
  any connection.
author: grc-engineering
version: "1.0"
source: auth0
profile: L1
tags: [password-policy, connections, authentication]

references:
  cis: ["5.2"]
  nist: [IA-5]
  hth: "auth0:2.1"

credentials:
  AUTH0_TOKEN:
    type: api_token
    scopes: ["read:connections"]
    required: true

inputs:
  auth0_api_base:
    description: Auth0 Management API base URL, including scheme and /api/v2 (e.g. https://yourcompany.auth0.com/api/v2)
    env: AUTH0_API_BASE
    required: true

steps:
  - id: get_database_connections
    action: api_call
    request:
      method: GET
      url: "{{auth0_api_base}}/connections?strategy=auth0"
      headers:
        Authorization: "Bearer {{AUTH0_TOKEN}}"
    extract:
      connections: "$[*]"
      connection_count: "$length"

assertions:
  - id: all_connections_strong_password_policy
    expr: 'size(connections.filter(c, c.options.password_policy != "good" && c.options.password_policy != "excellent")) == 0'
    severity: high
    title: All Database Connections Enforce a Good or Excellent Password Policy
    pass_message: "All {{connection_count}} database connection(s) enforce a good or excellent password policy"
    fail_message: "One or more database connections do not enforce a good or excellent password policy"
    finding:
      description: |
        At least one database connection's password_policy is below
        "good" (none, low, or fair), or unset. Weak policy tiers permit
        short passwords with little or no complexity requirement,
        directly increasing susceptibility to brute force, password
        guessing, and dictionary attacks against every application using
        that connection.

  - id: all_connections_brute_force_protection
    expr: "size(connections.filter(c, c.options.brute_force_protection != true)) == 0"
    severity: high
    title: All Database Connections Have Brute Force Protection Enabled
    pass_message: "All {{connection_count}} database connection(s) have brute force protection enabled"
    fail_message: "One or more database connections do not have brute force protection enabled"
    finding:
      description: |
        At least one database connection has brute_force_protection set
        to false or unset at the connection level. Even with the tenant
        attack-protection shield configured, a connection-level override
        can leave that specific connection open to unlimited password
        guessing.

remediation:
  description: |
    Set every database connection to the excellent password policy with
    history, dictionary, and personal-info checks, and enable brute
    force protection.
  steps:
    - "Navigate to Authentication → Database → select each connection → Password Policy"
    - "Set the policy to Excellent (10+ characters, all complexity requirements)"
    - "Enable password history (last 5), password dictionary, and no-personal-info checks"
    - "Confirm Brute Force Protection is enabled on the connection"
  api:
    method: PATCH
    url: "{{auth0_api_base}}/connections/{connection_id}"
    headers:
      Authorization: "Bearer {{AUTH0_TOKEN}}"
    body:
      options:
        password_policy: "excellent"
        brute_force_protection: true
        password_complexity_options:
          min_length: 14
        password_history:
          enable: true
          size: 5
        password_dictionary:
          enable: true
        password_no_personal_info:
          enable: true
  manual:
    - "Communicate policy tightening to users ahead of enforcement since existing passwords are not retroactively validated until next change"
