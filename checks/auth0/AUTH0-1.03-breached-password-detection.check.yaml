id: AUTH0-1.03
name: Verify Breached Password Detection Is Enabled
description: |
  Verifies that the Auth0 attack-protection breached password detection
  shield is enabled, which blocks credentials known to appear in public
  breach corpora at login and registration time.
author: grc-engineering
version: "1.0"
source: auth0
profile: L1
tags: [attack-protection, credential-hygiene, authentication]

references:
  cis: ["5.2"]
  nist: [IA-5]
  hth: "auth0:1.3"

credentials:
  AUTH0_TOKEN:
    type: api_token
    scopes: ["read:attack_protection"]
    required: true

inputs:
  auth0_api_base:
    description: Auth0 Management API base URL, including scheme and /api/v2 (e.g. https://yourcompany.auth0.com/api/v2)
    env: AUTH0_API_BASE
    required: true

steps:
  - id: get_breached_password_detection
    action: api_call
    request:
      method: GET
      url: "{{auth0_api_base}}/attack-protection/breached-password-detection"
      headers:
        Authorization: "Bearer {{AUTH0_TOKEN}}"
    extract:
      enabled: "$.enabled"

assertions:
  - id: breached_password_detection_enabled
    expr: "enabled == true"
    severity: high
    title: Breached Password Detection Is Enabled
    pass_message: "Breached password detection is enabled"
    fail_message: "Breached password detection is disabled"
    finding:
      description: |
        The attack-protection/breached-password-detection endpoint
        reports enabled: false. Without this shield, a user can log in
        or register with a password already known to appear in a public
        breach corpus, and Auth0 will neither block nor notify — leaving
        password-reuse-driven account takeover with no additional
        barrier beyond the underlying password check itself.

remediation:
  description: |
    Enable breached password detection with block shields covering login
    and pre-user-registration.
  steps:
    - "Navigate to Security → Attack Protection → Breached Password Detection"
    - "Enable Breached Password Detection (requires a Professional plan or above)"
    - "Enable admin notification and set the block shield to cover pre-user-registration"
  api:
    method: PATCH
    url: "{{auth0_api_base}}/attack-protection/breached-password-detection"
    headers:
      Authorization: "Bearer {{AUTH0_TOKEN}}"
    body:
      enabled: true
      method: "standard"
      shields: ["admin_notification", "block"]
      admin_notification_frequency: ["immediately"]
      stage:
        pre-user-registration:
          shields: ["block"]
  manual:
    - "Confirm the tenant plan supports breached password detection before troubleshooting a PATCH failure — this feature requires Professional plan or above"
