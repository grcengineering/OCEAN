id: AWS-IAM-3.01
name: Verify IAM Password Policy Compliance
description: |
  Verifies that the AWS account password policy meets security best practices
  including minimum length, complexity requirements, rotation, and reuse
  prevention. A strong password policy reduces the risk of credential-based
  attacks against IAM users with console access.
author: grc-engineering
version: "1.0"
source: aws
profile: L1
severity: high
tags: [iam, password-policy, identity, aws]

references:
  nist: IA-5(1)
  soc2: CC6.1

credentials:
  AWS_ACCESS_KEY_ID:
    type: api_token
    required: true
  AWS_SECRET_ACCESS_KEY:
    type: api_token
    required: true
  AWS_SESSION_TOKEN:
    type: api_token
    required: false

inputs:
  aws_region:
    description: AWS region for API calls
    env: AWS_REGION
    required: true

steps:
  - id: get_password_policy
    action: api_call
    request:
      method: POST
      url: "https://iam.amazonaws.com/"
      headers:
        Content-Type: "application/x-www-form-urlencoded"
      body: "Action=GetAccountPasswordPolicy&Version=2010-05-08"
    extract:
      min_length: "$.GetAccountPasswordPolicyResult.PasswordPolicy.MinimumPasswordLength"
      require_symbols: "$.GetAccountPasswordPolicyResult.PasswordPolicy.RequireSymbols"
      require_numbers: "$.GetAccountPasswordPolicyResult.PasswordPolicy.RequireNumbers"
      require_uppercase: "$.GetAccountPasswordPolicyResult.PasswordPolicy.RequireUppercaseCharacters"
      require_lowercase: "$.GetAccountPasswordPolicyResult.PasswordPolicy.RequireLowercaseCharacters"
      max_age: "$.GetAccountPasswordPolicyResult.PasswordPolicy.MaxPasswordAge"
      reuse_prevention: "$.GetAccountPasswordPolicyResult.PasswordPolicy.PasswordReusePrevention"

assertions:
  - id: minimum_length
    expr: "min_length >= 14"
    severity: high
    title: Password Minimum Length
    pass_message: "Password minimum length is {{min_length}} characters (>= 14)"
    fail_message: "Password minimum length is {{min_length}} characters (< 14 required)"
    finding:
      description: |
        The IAM password policy minimum length is below 14 characters. NIST SP 800-63B
        recommends a minimum of 8 characters, but CIS AWS Benchmark 1.8 recommends 14.
        Longer passwords significantly increase resistance to brute-force attacks.

  - id: complexity_symbols
    expr: "require_symbols == true"
    severity: high
    title: Password Requires Symbols
    pass_message: "Password policy requires at least one symbol"
    fail_message: "Password policy does not require symbols"
    finding:
      description: |
        The IAM password policy does not require special characters. Enable symbol
        requirements to increase password entropy and resist dictionary attacks.

  - id: complexity_numbers
    expr: "require_numbers == true"
    severity: high
    title: Password Requires Numbers
    pass_message: "Password policy requires at least one number"
    fail_message: "Password policy does not require numbers"
    finding:
      description: |
        The IAM password policy does not require numeric characters.

  - id: complexity_uppercase
    expr: "require_uppercase == true"
    severity: high
    title: Password Requires Uppercase
    pass_message: "Password policy requires at least one uppercase letter"
    fail_message: "Password policy does not require uppercase letters"
    finding:
      description: |
        The IAM password policy does not require uppercase characters.

  - id: complexity_lowercase
    expr: "require_lowercase == true"
    severity: high
    title: Password Requires Lowercase
    pass_message: "Password policy requires at least one lowercase letter"
    fail_message: "Password policy does not require lowercase letters"
    finding:
      description: |
        The IAM password policy does not require lowercase characters.

  - id: password_rotation
    expr: "max_age <= 90"
    severity: high
    title: Password Maximum Age
    pass_message: "Password max age is {{max_age}} days (<= 90)"
    fail_message: "Password max age is {{max_age}} days (> 90)"
    finding:
      description: |
        The IAM password policy allows passwords older than 90 days. CIS AWS
        Benchmark 1.10 recommends a maximum password age of 90 days or less.

  - id: password_reuse
    expr: "reuse_prevention >= 24"
    severity: high
    title: Password Reuse Prevention
    pass_message: "Password reuse prevention remembers {{reuse_prevention}} passwords (>= 24)"
    fail_message: "Password reuse prevention remembers {{reuse_prevention}} passwords (< 24)"
    finding:
      description: |
        The IAM password policy does not prevent reuse of the last 24 passwords.
        CIS AWS Benchmark 1.11 recommends preventing reuse of at least 24 passwords
        to reduce the risk of credential recycling.

remediation:
  description: |
    Update the AWS account password policy to meet CIS AWS Benchmark requirements
    for length, complexity, rotation, and reuse prevention.
  steps:
    - "Navigate to IAM > Account settings > Password policy"
    - "Set minimum password length to 14 or greater"
    - "Enable 'Require at least one uppercase letter'"
    - "Enable 'Require at least one lowercase letter'"
    - "Enable 'Require at least one number'"
    - "Enable 'Require at least one non-alphanumeric character'"
    - "Set 'Password expiration period' to 90 days or less"
    - "Set 'Remember last passwords' to 24"
    - "Click 'Save changes'"
