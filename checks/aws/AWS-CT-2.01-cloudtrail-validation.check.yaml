id: AWS-CT-2.01
name: Verify CloudTrail Log File Validation
description: |
  Verifies that CloudTrail log file integrity validation is enabled. Log file
  validation creates a digitally signed digest file for each log delivery,
  allowing you to detect whether log files were modified, deleted, or forged
  after delivery. This is essential for maintaining chain of custody for
  audit evidence.
author: grc-engineering
version: "1.0"
source: aws
profile: L2
severity: high
tags: [cloudtrail, logging, integrity, aws]

references:
  nist: AU-9
  soc2: CC7.2

credentials:
  AWS_ACCESS_KEY_ID:
    type: api_token
    required: true
  AWS_SECRET_ACCESS_KEY:
    type: api_token
    required: true
  AWS_SESSION_TOKEN:
    type: api_token
    required: false

inputs:
  aws_region:
    description: AWS region for API calls
    env: AWS_REGION
    required: true

steps:
  - id: describe_trails
    action: api_call
    request:
      method: POST
      url: "https://cloudtrail.{{aws_region}}.amazonaws.com/"
      headers:
        X-Amz-Target: "com.amazonaws.cloudtrail.v20131101.CloudTrail_20131101.DescribeTrails"
        Content-Type: "application/x-amz-json-1.1"
      body: {}
    extract:
      trails: "$.trailList"

assertions:
  - id: log_file_validation_enabled
    expr: "size(trails.filter(t, t.LogFileValidationEnabled == false)) == 0"
    severity: high
    title: Log File Validation Enabled
    pass_message: "All CloudTrail trails have log file validation enabled"
    fail_message: "One or more CloudTrail trails do not have log file validation enabled"
    finding:
      description: |
        One or more CloudTrail trails do not have log file integrity validation
        enabled. Without validation, there is no mechanism to verify that log
        files have not been tampered with after delivery. An attacker with access
        to the S3 bucket could modify or delete logs to cover their tracks.
        CIS AWS Benchmark 3.2 requires log file validation on all trails.

remediation:
  description: |
    Enable log file integrity validation on all CloudTrail trails to ensure
    tamper-evident logging.
  steps:
    - "Navigate to CloudTrail > Trails"
    - "Select each trail without validation enabled"
    - "Click 'Edit'"
    - "Under 'Additional settings', enable 'Log file validation'"
    - "Click 'Save changes'"
    - "Use 'aws cloudtrail validate-logs' CLI command to verify existing log integrity"
