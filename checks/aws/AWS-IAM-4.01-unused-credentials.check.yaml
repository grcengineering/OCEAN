id: AWS-IAM-4.01
name: Detect Unused IAM Credentials
description: |
  Identifies IAM user credentials (passwords and access keys) that have not
  been used within the last 90 days. Unused credentials increase the attack
  surface and may indicate orphaned accounts, former employees, or service
  accounts that should be decommissioned.
author: grc-engineering
version: "1.0"
source: aws
profile: L2
severity: medium
tags: [iam, credentials, hygiene, aws]

references:
  nist: AC-2(3)
  soc2: CC6.1

credentials:
  AWS_ACCESS_KEY_ID:
    type: api_token
    required: true
  AWS_SECRET_ACCESS_KEY:
    type: api_token
    required: true
  AWS_SESSION_TOKEN:
    type: api_token
    required: false

inputs:
  aws_region:
    description: AWS region for API calls
    env: AWS_REGION
    required: true

steps:
  - id: generate_credential_report
    action: api_call
    request:
      method: POST
      url: "https://iam.amazonaws.com/"
      headers:
        Content-Type: "application/x-www-form-urlencoded"
      body: "Action=GenerateCredentialReport&Version=2010-05-08"
    extract:
      report_state: "$.GenerateCredentialReportResult.State"

  - id: get_credential_report
    action: api_call
    request:
      method: POST
      url: "https://iam.amazonaws.com/"
      headers:
        Content-Type: "application/x-www-form-urlencoded"
      body: "Action=GetCredentialReport&Version=2010-05-08"
    extract:
      report_content: "$.GetCredentialReportResult.Content"
      unused_passwords: "$.GetCredentialReportResult.Users[?(@.password_last_used_age > 90)]"
      unused_access_keys: "$.GetCredentialReportResult.Users[?(@.access_key_last_used_age > 90)]"

assertions:
  - id: no_unused_passwords
    expr: "unused_passwords | length == 0"
    severity: medium
    title: No Unused Console Passwords
    pass_message: "All IAM user passwords have been used within 90 days"
    fail_message: "{{unused_passwords | length}} IAM user(s) have passwords unused for 90+ days"
    finding:
      description: |
        One or more IAM users have console passwords that have not been used in
        over 90 days. These accounts may belong to former employees or inactive
        service accounts. Unused credentials increase the attack surface and
        should be disabled or removed per CIS AWS Benchmark 1.12.

  - id: no_unused_access_keys
    expr: "unused_access_keys | length == 0"
    severity: medium
    title: No Unused Access Keys
    pass_message: "All active access keys have been used within 90 days"
    fail_message: "{{unused_access_keys | length}} access key(s) unused for 90+ days"
    finding:
      description: |
        One or more IAM access keys have not been used in over 90 days. Stale
        access keys are a common vector for unauthorized access, especially if
        they were embedded in code, CI/CD pipelines, or developer machines that
        are no longer actively managed.

remediation:
  description: |
    Review and disable or delete IAM credentials that have not been used in
    the last 90 days. Establish a recurring access review process.
  steps:
    - "Download the IAM Credential Report from IAM > Credential report"
    - "Identify users with password_last_used or access_key_last_used older than 90 days"
    - "For inactive console users: disable the password via IAM > Users > Security credentials"
    - "For inactive access keys: deactivate the key first, wait 30 days, then delete"
    - "Document the review in your access management ticketing system"
    - "Schedule quarterly credential reviews"
