id: AWS-S3-3.01
name: Verify S3 Bucket Logging Enabled
description: |
  Verifies that server access logging is enabled on S3 buckets. S3 access logs
  provide detailed records of requests made to a bucket, including the requester,
  bucket name, request time, action, response status, and error codes. These
  logs are essential for security auditing, access analysis, and incident
  investigation.
author: grc-engineering
version: "1.0"
source: aws
profile: L2
severity: medium
tags: [s3, logging, monitoring, aws]

references:
  nist: AU-2
  soc2: CC7.2

credentials:
  AWS_ACCESS_KEY_ID:
    type: api_token
    required: true
  AWS_SECRET_ACCESS_KEY:
    type: api_token
    required: true
  AWS_SESSION_TOKEN:
    type: api_token
    required: false

inputs:
  aws_region:
    description: AWS region for API calls
    env: AWS_REGION
    required: true

steps:
  - id: list_buckets
    action: api_call
    request:
      method: GET
      url: "https://s3.{{aws_region}}.amazonaws.com/"
    extract:
      buckets: "$.ListAllMyBucketsResult.Buckets.Bucket"

  - id: get_bucket_logging
    action: api_call
    request:
      method: GET
      url: "https://{{buckets[*].Name}}.s3.{{aws_region}}.amazonaws.com/?logging"
    extract:
      buckets_without_logging: "$.Buckets[?(@.LoggingEnabled == null)]"

assertions:
  - id: all_buckets_have_logging
    expr: "buckets_without_logging | length == 0"
    severity: medium
    title: All S3 Buckets Have Access Logging
    pass_message: "All {{buckets | length}} S3 bucket(s) have server access logging enabled"
    fail_message: "{{buckets_without_logging | length}} S3 bucket(s) do not have access logging enabled"
    finding:
      description: |
        One or more S3 buckets do not have server access logging enabled. Without
        access logs, there is no record of who accessed data in the bucket, when,
        or what operations were performed. This makes it impossible to detect
        unauthorized data access or exfiltration. CIS AWS Benchmark 2.1.3
        recommends enabling access logging on all S3 buckets.

remediation:
  description: |
    Enable server access logging on all S3 buckets. Logs should be delivered
    to a dedicated logging bucket in the same region.
  steps:
    - "Create a dedicated logging bucket (e.g., 'company-s3-access-logs') if one does not exist"
    - "Set the logging bucket's ACL to allow the S3 log delivery group to write"
    - "Navigate to S3 > Select the target bucket > Properties"
    - "Under 'Server access logging', click 'Edit'"
    - "Enable server access logging"
    - "Specify the target logging bucket and an optional prefix (e.g., 'logs/bucket-name/')"
    - "Click 'Save changes'"
    - "Configure lifecycle rules on the logging bucket to manage log retention"
