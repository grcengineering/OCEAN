id: GH-3.04
name: Configure Self-Hosted Runner Security
description: |
  Assesses the organization's self-hosted runner configuration to ensure runners
  are properly inventoried and labeled for security-appropriate workload assignment.
author: grc-engineering
version: "1.0"
source: github
profile: L2
tags: [runners, ci-cd, organization]

references:
  cis: "3.4"
  nist: CM-6
  soc2: CC6.1
  iso27001: A.12.1.4

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org, manage_runners:org]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_org_runners
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/actions/runners"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      total_count: "$.total_count"
      runners: "$.runners"
      runner_names: "$.runners[*].name"
      runner_labels: "$.runners[*].labels[*].name"
      runner_statuses: "$.runners[*].status"

assertions:
  - id: runners_inventoried
    expr: "total_count >= 0"
    severity: medium
    title: Self-Hosted Runner Inventory
    pass_message: "{{total_count}} self-hosted runner(s) registered in the organization"
    fail_message: "Unable to retrieve self-hosted runner inventory"
    finding:
      description: |
        Self-hosted runners execute workflow jobs on infrastructure you manage.
        Without proper inventory and labeling, runners may process workloads
        beyond their intended security boundary. Ensure all self-hosted runners
        are tracked, labeled by environment (production, staging, development),
        and configured with appropriate access controls. Runners should use
        ephemeral tokens, run as non-root, and be hardened per organizational
        security baselines.

remediation:
  description: |
    Review and harden all self-hosted runners. Each runner should be labeled
    by environment, use ephemeral credentials, and run with minimal privileges.
    Consider using ephemeral runners that are reprovisioned after each job.
  steps:
    - "Navigate to github.com/orgs/{org}/settings/actions/runners"
    - "Review each runner's labels and ensure they reflect the environment (e.g., production, staging)"
    - "Remove any stale or unrecognized runners"
    - "Ensure runners use ephemeral tokens (--ephemeral flag during registration)"
    - "Verify runners execute as non-root with restricted filesystem access"
  api:
    method: GET
    url: "https://api.github.com/orgs/{{org}}/actions/runners"
  cli:
    command: "gh api orgs/{{org}}/actions/runners --jq '.runners[] | {name, status, labels: [.labels[].name]}'"
