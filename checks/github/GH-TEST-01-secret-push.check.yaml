id: GH-TEST-01
name: Secret Push Protection Test
description: |
  Actively tests secret push protection by attempting to push a file containing
  a known test secret pattern. If push protection is working correctly, GitHub
  will reject the push with a 422 status code. This test creates audit trail
  entries in GitHub.
author: grc-engineering
version: "1.0"
source: github
type: active
safety: observable
environment: staging
profile: L1
tags: [secret-scanning, push-protection, active-test]

pre_flight:
  - "Verify GitHub token has write access to repository"
  - "Verify repository is a test/staging repository"
  - "This test creates audit trail entries in GitHub"

references:
  cis: "2.1"
  nist: ["IA-5(7)", "SC-28"]
  hth: "github:2.2"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [repo]
    required: true

inputs:
  owner:
    description: Repository owner
    env: GITHUB_OWNER
    required: true
  repo:
    description: Repository name
    env: GITHUB_REPO
    required: true

steps:
  - id: attempt_push
    action: api_call
    request:
      method: PUT
      url: "https://api.github.com/repos/{{owner}}/{{repo}}/contents/ocean-test-secret.txt"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
      body:
        message: "ocean: secret push protection test"
        content: "{{base64('TEST_TOKEN=ghp_ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef01')}}"
    on_error:
      422: continue
    extract:
      push_status: "$status_code"
      push_sha: "$.content.sha"

  - id: cleanup
    action: api_call
    when: "push_status != 422"
    request:
      method: DELETE
      url: "https://api.github.com/repos/{{owner}}/{{repo}}/contents/ocean-test-secret.txt"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
      body:
        message: "ocean: cleanup test file"
        sha: "{{push_sha}}"

assertions:
  - id: push_blocked
    expr: "push_status == 422"
    severity: critical
    title: Secret Push Protection Blocks Known Secrets
    pass_message: "Push protection correctly blocked a commit containing a known secret pattern"
    fail_message: "Push protection did NOT block a commit containing a known secret pattern"
    finding:
      description: |
        A test push containing a known GitHub personal access token pattern was
        not blocked by push protection. This means secrets can be committed to
        the repository without being caught. Enable push protection in repository
        Settings → Code security and analysis.

remediation:
  description: |
    Enable secret scanning push protection to block commits that contain
    known secret patterns before they reach the repository.
  steps:
    - "Navigate to github.com/{{owner}}/{{repo}}/settings/security_analysis"
    - "Enable 'Secret scanning'"
    - "Enable 'Push protection'"
    - "Click Save"
  api:
    method: PATCH
    url: "https://api.github.com/repos/{{owner}}/{{repo}}"
    body:
      security_and_analysis:
        secret_scanning:
          status: "enabled"
        secret_scanning_push_protection:
          status: "enabled"
