id: GH-2.01
name: Enable Secret Scanning and Push Protection
description: |
  Verifies that secret scanning and push protection are enabled on the
  repository, preventing accidental exposure of credentials, API keys,
  and other sensitive data in commits.
author: grc-engineering
version: "1.0"
source: github
profile: L1
tags: [secret-scanning, push-protection, repository]

references:
  cis: "2.2"
  nist: ["RA-5", "SA-11"]
  soc2: CC7.2
  iso27001: A.12.6.1
  hth: "github:2.2"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [repo]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true
  owner:
    description: Repository owner
    env: GITHUB_OWNER
    required: true
  repo:
    description: Repository name
    env: GITHUB_REPO
    required: true

steps:
  - id: get_repo_security
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/repos/{{owner}}/{{repo}}"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      secret_scanning_status: "$.security_and_analysis.secret_scanning.status"
      push_protection_status: "$.security_and_analysis.secret_scanning_push_protection.status"

assertions:
  - id: secret_scanning_enabled
    expr: "secret_scanning_status == 'enabled'"
    severity: critical
    title: Secret Scanning Enabled
    pass_message: "Secret scanning is enabled on the repository"
    fail_message: "Secret scanning is NOT enabled on the repository"
    finding:
      description: |
        Secret scanning is not enabled for this repository. Without secret
        scanning, leaked credentials, API keys, and tokens in the codebase
        will not be detected. Enable secret scanning in repository Settings →
        Code security and analysis.

  - id: push_protection_enabled
    expr: "push_protection_status == 'enabled'"
    severity: high
    title: Push Protection Enabled
    pass_message: "Push protection is enabled on the repository"
    fail_message: "Push protection is NOT enabled on the repository"
    finding:
      description: |
        Push protection is not enabled for this repository. Without push
        protection, contributors can push commits containing secrets without
        being blocked. Enable push protection in repository Settings →
        Code security and analysis.

remediation:
  description: |
    Enable secret scanning and push protection in repository Settings →
    Code security and analysis. This will scan for known secret patterns
    and block pushes that contain detected secrets.
  steps:
    - "Navigate to github.com/{{owner}}/{{repo}}/settings/security_analysis"
    - "Enable 'Secret scanning'"
    - "Enable 'Push protection'"
    - "Click Save"
  api:
    method: PATCH
    url: "https://api.github.com/repos/{{owner}}/{{repo}}"
    body:
      security_and_analysis:
        secret_scanning:
          status: "enabled"
        secret_scanning_push_protection:
          status: "enabled"
  cli:
    command: "gh api repos/{{owner}}/{{repo}} -X PATCH -f security_and_analysis[secret_scanning][status]=enabled -f security_and_analysis[secret_scanning_push_protection][status]=enabled"
