id: GH-6.05
name: Enforce Dependency Review Across the Organization
description: |
  Verifies that an active organization ruleset requires the
  dependency-review workflow to pass before merging, so no repository can
  skip or disable dependency review at the individual repository level.
author: grc-engineering
version: "1.0"
source: github
profile: L2
tags: [dependency-review, rulesets, supply-chain, organization]

references:
  nist: ["SA-12", "SA-11"]
  soc2: CC7.2
  hth: "github:6.5"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_org_rulesets
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/rulesets"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      rulesets: "$"
      ruleset_count: "$length"

assertions:
  - id: dependency_review_required_workflow
    expr: >-
      rulesets.exists(rs, rs.enforcement == "active" && has(rs.rules) &&
      rs.rules.exists(r, r.type == "workflows" && has(r.parameters) &&
      has(r.parameters.workflows) &&
      r.parameters.workflows.exists(w, w.path.contains("dependency-review"))))
    severity: high
    title: Dependency Review Enforced Org-Wide
    pass_message: "An active organization ruleset requires the dependency-review workflow"
    fail_message: "No active organization ruleset requires a dependency-review workflow"
    finding:
      description: |
        No active organization ruleset enforces the dependency-review-action
        as a required workflow. Without organization-level enforcement,
        individual repositories can skip or disable dependency review,
        allowing pull requests that introduce vulnerable or malicious
        dependencies to merge without any automated block. Individual
        repository configuration (Section 6.1) is inconsistent and can be
        bypassed by repository admins.

remediation:
  description: |
    Create a central dependency-review workflow and enforce it organization-wide
    via a ruleset with a "Require workflows to pass before merging" rule, so
    repository admins cannot disable it locally.
  steps:
    - "Create .github/workflows/dependency-review.yml in a central repository (e.g. the .github repo)"
    - "Navigate to github.com/organizations/{{org}}/settings/rules"
    - "Click 'New ruleset' -> 'New branch ruleset'"
    - "Set target branches to main/master and target repositories to All repositories"
    - "Under Rules, add 'Require workflows to pass before merging' and select the dependency-review workflow"
    - "Set enforcement to Active"
  api:
    method: POST
    url: "https://api.github.com/orgs/{{org}}/rulesets"
    body:
      name: "Require Dependency Review"
      enforcement: "active"
      target: "branch"
      conditions:
        ref_name:
          include: ["refs/heads/main", "refs/heads/master"]
          exclude: []
        repository_name:
          include: ["~ALL"]
          exclude: []
      rules:
        - type: "workflows"
          parameters:
            workflows:
              - path: ".github/workflows/dependency-review.yml"
                repository_id: 0
                ref: "refs/heads/main"
  cli:
    command: "gh api orgs/{{org}}/rulesets --jq '.[] | {name, enforcement, id}'"
