id: GH-2.02
name: Enable Dependabot Security Updates
description: |
  Verifies that Dependabot security updates are enabled on the repository
  and checks for any open critical vulnerability alerts that require
  immediate remediation.
author: grc-engineering
version: "1.0"
source: github
profile: L1
tags: [dependabot, vulnerability, dependency]

references:
  cis: "2.2"
  nist: ["RA-5", "SI-2"]
  soc2: CC7.2
  iso27001: A.12.6.1

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [repo, security_events]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true
  owner:
    description: Repository owner
    env: GITHUB_OWNER
    required: true
  repo:
    description: Repository name
    env: GITHUB_REPO
    required: true

steps:
  - id: get_dependabot_status
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/repos/{{owner}}/{{repo}}"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      dependabot_status: "$.security_and_analysis.dependabot_security_updates.status"

  - id: get_critical_alerts
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/repos/{{owner}}/{{repo}}/dependabot/alerts?state=open&severity=critical&per_page=1"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      critical_alert_count: "$length"

assertions:
  - id: dependabot_enabled
    expr: "dependabot_status == 'enabled'"
    severity: high
    title: Dependabot Security Updates Enabled
    pass_message: "Dependabot security updates are enabled on the repository"
    fail_message: "Dependabot security updates are NOT enabled on the repository"
    finding:
      description: |
        Dependabot security updates are not enabled for this repository.
        Without Dependabot, known vulnerabilities in dependencies will not
        be automatically patched via pull requests. Enable Dependabot in
        repository Settings → Code security and analysis.

  - id: no_critical_alerts
    expr: "critical_alert_count == 0"
    severity: critical
    title: No Open Critical Dependabot Alerts
    pass_message: "No open critical Dependabot alerts found"
    fail_message: "Open critical Dependabot alerts were found"
    finding:
      description: |
        One or more critical Dependabot alerts are open on this repository.
        Critical alerts indicate exploitable vulnerabilities in dependencies
        that could lead to remote code execution, data exfiltration, or
        privilege escalation. Review and remediate these alerts immediately.

remediation:
  description: |
    Enable Dependabot security updates in repository Settings → Code security
    and analysis. Review and resolve all open critical alerts by upgrading
    affected dependencies or applying suggested patches.
  steps:
    - "Navigate to github.com/{{owner}}/{{repo}}/settings/security_analysis"
    - "Enable 'Dependabot security updates'"
    - "Review open alerts at github.com/{{owner}}/{{repo}}/security/dependabot"
    - "Merge Dependabot pull requests or manually upgrade affected dependencies"
  api:
    method: PATCH
    url: "https://api.github.com/repos/{{owner}}/{{repo}}"
    body:
      security_and_analysis:
        dependabot_security_updates:
          status: "enabled"
  cli:
    command: "gh api repos/{{owner}}/{{repo}} -X PATCH -f security_and_analysis[dependabot_security_updates][status]=enabled"
