id: GH-TEST-02
name: Branch Protection Bypass Test
description: |
  Actively tests branch protection by attempting to push a file directly to the
  default branch. If branch protection is working correctly, GitHub will reject
  the push with a 403 or 422 status code. This test attempts direct push to
  the default branch.
author: grc-engineering
version: "1.0"
source: github
type: active
safety: observable
environment: staging
profile: L1
tags: [branch-protection, active-test]

pre_flight:
  - "Verify GitHub token has write access"
  - "Verify repository is a test/staging repository"
  - "This test attempts direct push to default branch"

references:
  cis: "2.1"
  nist: ["CM-3", "CM-5"]
  hth: "github:2.1"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [repo]
    required: true

inputs:
  owner:
    description: Repository owner
    env: GITHUB_OWNER
    required: true
  repo:
    description: Repository name
    env: GITHUB_REPO
    required: true

steps:
  - id: get_default_branch
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/repos/{{owner}}/{{repo}}"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      default_branch: "$.default_branch"

  - id: attempt_push
    action: api_call
    request:
      method: PUT
      url: "https://api.github.com/repos/{{owner}}/{{repo}}/contents/ocean-test-branch-bypass.txt"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
      body:
        message: "ocean: branch protection bypass test"
        content: "{{base64('test content')}}"
    on_error:
      403: continue
      422: continue
    extract:
      push_status: "$status_code"
      push_sha: "$.content.sha"

  - id: cleanup
    action: api_call
    when: "push_status == 201"
    request:
      method: DELETE
      url: "https://api.github.com/repos/{{owner}}/{{repo}}/contents/ocean-test-branch-bypass.txt"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
      body:
        message: "ocean: cleanup test file"
        sha: "{{push_sha}}"

assertions:
  - id: push_blocked
    expr: "push_status == 403 || push_status == 422"
    severity: critical
    title: Branch Protection Blocks Direct Push
    pass_message: "Branch protection correctly blocked a direct push to the default branch"
    fail_message: "Branch protection did NOT block a direct push to the default branch"
    finding:
      description: |
        A direct push to the default branch was not blocked by branch protection.
        This means any contributor with write access can push directly to the
        default branch, bypassing code review and CI checks. Enable branch
        protection in repository Settings → Branches.

remediation:
  description: |
    Enable branch protection on the default branch with required pull request
    reviews to prevent direct pushes.
  steps:
    - "Navigate to github.com/{{owner}}/{{repo}}/settings/branches"
    - "Click 'Add branch protection rule'"
    - "Set branch name pattern to the default branch name"
    - "Enable 'Require a pull request before merging'"
    - "Enable 'Require approvals' with at least 1 reviewer"
    - "Enable 'Include administrators'"
    - "Click 'Create' or 'Save changes'"
  api:
    method: PUT
    url: "https://api.github.com/repos/{{owner}}/{{repo}}/branches/{{default_branch}}/protection"
    body:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      enforce_admins: true
      required_status_checks: null
      restrictions: null
