id: GH-8.01
name: Enable Audit Log Streaming
description: |
  Verifies that audit log streaming is configured for the organization.
  Audit log streaming sends events to an external SIEM or log management
  system for long-term retention and analysis.
author: grc-engineering
version: "1.0"
source: github
profile: L2
tags: [audit-log, siem, enterprise]

references:
  cis: "8.1"
  nist: ["AU-2", "AU-6"]
  soc2: CC7.2
  iso27001: A.12.4.1

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_audit_log_streams
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/audit-log/streams"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      404: continue
    extract:
      stream_count: "$length"

assertions:
  - id: audit_log_streaming_enabled
    expr: "stream_count >= 1"
    severity: high
    title: Audit Log Streaming Configured
    pass_message: "{{stream_count}} audit log stream(s) configured"
    fail_message: "No audit log streams are configured"
    finding:
      description: |
        No audit log streaming is configured for this organization. Without
        streaming, audit logs are only available through the GitHub UI and
        API with limited retention. Configure audit log streaming to send
        events to a SIEM or log management system for long-term retention,
        alerting, and compliance. This feature requires GitHub Enterprise Cloud.

remediation:
  description: |
    Configure audit log streaming to an external SIEM or log management
    system. Supported destinations include Splunk, Azure Event Hubs,
    Amazon S3, Google Cloud Storage, and Datadog.
  steps:
    - "Navigate to github.com/orgs/{{org}}/settings/audit-log"
    - "Click 'Log streaming' → 'Set up a stream'"
    - "Select your destination provider"
    - "Configure the connection credentials"
    - "Click 'Save' and verify events are flowing"
  api:
    method: POST
    url: "https://api.github.com/orgs/{{org}}/audit-log/streams"
    body:
      enabled: true
      stream_type: "Azure Event Hubs"
      vendor_specific: {}
  cli:
    command: "gh api orgs/{{org}}/audit-log/streams --jq '.[].stream_type'"
