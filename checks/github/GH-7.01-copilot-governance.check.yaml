id: GH-7.01
name: Configure Copilot Governance
description: |
  Verifies that GitHub Copilot seat assignment is governed and not set to
  auto-assign for all members. Selective assignment ensures Copilot access
  is granted only to approved users with appropriate oversight.
author: grc-engineering
version: "1.0"
source: github
profile: L2
tags: [copilot, ai, governance]

references:
  cis: "7.1"
  nist: ["AC-3", "AU-2"]
  soc2: ["CC6.1", "CC7.2"]
  iso27001: A.9.4.1
  hth: "github:7.1"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [manage_billing:copilot, read:org]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_copilot_billing
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/copilot/billing"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      404: continue
    extract:
      seat_management: "$.seat_management_setting"
      seat_breakdown_total: "$.seat_breakdown.total"

assertions:
  - id: copilot_selective_assignment
    expr: "seat_management == 'assign_selected'"
    severity: medium
    title: Copilot Seat Assignment Governance
    pass_message: "Copilot seats are selectively assigned (not auto-assigned to all members)"
    fail_message: "Copilot is set to '{{seat_management}}' — should be 'assign_selected'"
    finding:
      description: |
        GitHub Copilot is configured to automatically assign seats to all
        organization members rather than using selective assignment. This
        means any member can use Copilot without explicit approval. Use
        selective assignment to control which teams and individuals have
        Copilot access, ensuring proper governance and cost management.

remediation:
  description: |
    Configure Copilot to use selective seat assignment so that access
    is explicitly granted to approved users and teams.
  steps:
    - "Navigate to github.com/orgs/{{org}}/settings/copilot"
    - "Under 'Access management', select 'Selected teams/members'"
    - "Assign Copilot seats to specific teams or individuals"
    - "Click Save"
  api:
    method: PATCH
    url: "https://api.github.com/orgs/{{org}}/copilot/billing"
    body:
      seat_management_setting: "assign_selected"
  cli:
    command: "gh api orgs/{{org}}/copilot/billing --jq '.seat_management_setting'"
