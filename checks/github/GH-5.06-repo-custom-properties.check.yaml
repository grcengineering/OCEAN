id: GH-5.06
name: Define Repository Custom Properties for Security Classification
description: |
  Verifies that the GitHub organization has defined custom properties
  (e.g., a security-tier classification) that repositories can be tagged
  with, so security policy — rulesets, security configurations, review
  requirements — can target repositories by classification instead of
  hand-maintained lists.
author: grc-engineering
version: "1.0"
source: github
profile: L2
tags: [custom-properties, classification, organization]

references:
  cis: "1.1"
  nist: ["RA-2", "SC-16", "CM-8"]
  soc2: CC3.2
  hth: "github:5.6"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org, read:org]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_custom_properties_schema
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/properties/schema"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      "*": continue
    extract:
      property_count: "$length"
      required_flags: "$[*].required"

assertions:
  - id: custom_properties_defined
    expr: "property_count > 0"
    severity: medium
    title: Organization Custom Properties Defined
    pass_message: "{{property_count}} custom propert(y/ies) defined for the organization"
    fail_message: "No organization-level custom properties are defined"
    finding:
      description: |
        No custom properties are defined for this organization. Without a
        required classification property (e.g., security-tier), there is no
        way to target security policy — rulesets, security configurations,
        or review requirements — at repositories by risk classification.
        Security controls end up applied via hand-maintained lists that
        silently miss newly created or renamed repositories.

  - id: required_property_exists
    expr: "required_flags.exists(r, r == true)"
    severity: low
    title: At Least One Required Custom Property
    pass_message: "At least one custom property is marked required"
    fail_message: "No custom property is marked required — classification is optional"
    finding:
      description: |
        None of the organization's custom properties are marked as required.
        An optional classification property is skipped by default, so
        repositories can exist without ever being classified. Mark the
        security classification property as required so every repository
        must declare its tier at creation.

remediation:
  description: |
    Define a required organization-level custom property (e.g., security-tier)
    with a single-select set of values, then use it to target organization
    rulesets and security configurations at repositories by classification.
  steps:
    - "Navigate to github.com/organizations/{{org}}/settings/repository-custom-properties"
    - "Click 'New property'"
    - "Name it 'security-tier', type 'Single select', values critical/high/standard/low"
    - "Set 'Required' with a default value, e.g. 'standard'"
    - "Click 'Save property'"
    - "Set the property on existing repositories via the org properties UI or API"
  api:
    method: POST
    url: "https://api.github.com/orgs/{{org}}/properties/schema"
    body:
      - property_name: "security-tier"
        value_type: "single_select"
        required: true
        default_value: "standard"
        description: "Security classification tier"
        allowed_values: ["critical", "high", "standard", "low"]
  cli:
    command: "gh api orgs/{{org}}/properties/schema --jq '.[] | {property_name, value_type, required}'"
