id: GH-3.07
name: Require CODEOWNERS File
description: |
  Verifies that the repository contains a CODEOWNERS file in one of the
  standard locations to enforce code review ownership and accountability.
author: grc-engineering
version: "1.0"
source: github
profile: L2
tags: [codeowners, code-review, repository]

references:
  nist: CM-5
  soc2: CC8.1
  hth: "github:3.11"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [repo]
    required: true

inputs:
  owner:
    description: Repository owner (user or organization)
    env: GITHUB_OWNER
    required: true
  repo:
    description: Repository name
    env: GITHUB_REPO
    required: true

steps:
  - id: check_root_codeowners
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/repos/{{owner}}/{{repo}}/contents/CODEOWNERS"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      404: continue
    extract:
      root_codeowners_exists: "$.name"

  - id: check_github_codeowners
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/repos/{{owner}}/{{repo}}/contents/.github/CODEOWNERS"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      404: continue
    extract:
      github_codeowners_exists: "$.name"

  - id: check_docs_codeowners
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/repos/{{owner}}/{{repo}}/contents/docs/CODEOWNERS"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      404: continue
    extract:
      docs_codeowners_exists: "$.name"

assertions:
  - id: codeowners_exists
    expr: 'root_codeowners_exists != "" || github_codeowners_exists != "" || docs_codeowners_exists != ""'
    severity: medium
    title: CODEOWNERS File Exists
    pass_message: "CODEOWNERS file found in the repository"
    fail_message: "No CODEOWNERS file found in any standard location (/, /.github/, /docs/)"
    finding:
      description: |
        The repository does not contain a CODEOWNERS file in any of the standard
        locations (root, .github/, or docs/). Without a CODEOWNERS file, there is
        no automatic assignment of code reviewers based on file paths, which can
        lead to changes being merged without review from the appropriate domain
        experts. Create a CODEOWNERS file to define ownership and enforce review
        requirements for critical paths.

remediation:
  description: |
    Create a CODEOWNERS file to define code ownership and automatically assign
    reviewers. Place it in one of the standard locations and configure branch
    protection to require review from code owners.
  steps:
    - "Create a CODEOWNERS file at .github/CODEOWNERS (recommended location)"
    - "Define ownership rules using the format: <pattern> @owner1 @owner2"
    - "Example: '* @org/core-team' assigns the core team to all files"
    - "Example: '*.js @org/frontend-team' assigns the frontend team to JS files"
    - "Enable 'Require review from Code Owners' in branch protection settings"
  api:
    method: PUT
    url: "https://api.github.com/repos/{{owner}}/{{repo}}/contents/.github/CODEOWNERS"
    body:
      message: "Add CODEOWNERS file"
      content: "KiBAb3JnL2NvcmUtdGVhbQo="
  cli:
    command: "echo '* @org/core-team' > .github/CODEOWNERS && git add .github/CODEOWNERS && git commit -m 'Add CODEOWNERS file'"
