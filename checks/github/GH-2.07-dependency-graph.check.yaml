id: GH-2.07
name: Enable Dependency Graph
description: |
  Verifies that the dependency graph is enabled on the repository,
  providing visibility into all direct and transitive dependencies
  for vulnerability detection and supply chain analysis.
author: grc-engineering
version: "1.0"
source: github
profile: L1
tags: [dependency-review, dependency-graph, repository]

references:
  cis: "6.1"
  nist: SA-12
  soc2: CC7.2
  iso27001: A.14.2.7

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [repo]
    required: true

inputs:
  owner:
    description: Repository owner
    env: GITHUB_OWNER
    required: true
  repo:
    description: Repository name
    env: GITHUB_REPO
    required: true

steps:
  - id: get_dependency_graph_status
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/repos/{{owner}}/{{repo}}"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      dep_graph_status: "$.security_and_analysis.dependency_graph.status"

assertions:
  - id: dependency_graph_enabled
    expr: "dep_graph_status == 'enabled'"
    severity: medium
    title: Dependency Graph Enabled
    pass_message: "Dependency graph is enabled on the repository"
    fail_message: "Dependency graph is NOT enabled on the repository"
    finding:
      description: |
        The dependency graph is not enabled for this repository. Without
        the dependency graph, GitHub cannot identify vulnerable dependencies,
        generate SBOMs, or provide dependency review on pull requests.
        The dependency graph is a prerequisite for Dependabot alerts and
        security updates. Enable it in repository Settings → Code security
        and analysis.

remediation:
  description: |
    Enable the dependency graph in repository Settings → Code security
    and analysis. The dependency graph parses manifest and lock files
    to build a complete picture of direct and transitive dependencies.
  steps:
    - "Navigate to github.com/{{owner}}/{{repo}}/settings/security_analysis"
    - "Enable 'Dependency graph'"
    - "Click Save"
  api:
    method: PATCH
    url: "https://api.github.com/repos/{{owner}}/{{repo}}"
    body:
      security_and_analysis:
        dependency_graph:
          status: "enabled"
  cli:
    command: "gh api repos/{{owner}}/{{repo}} -X PATCH -f security_and_analysis[dependency_graph][status]=enabled"
