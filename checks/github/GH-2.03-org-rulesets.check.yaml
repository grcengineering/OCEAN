id: GH-2.03
name: Configure Organization Rulesets
description: |
  Verifies that the GitHub organization has at least one active ruleset
  configured to enforce repository governance policies such as branch
  protection, commit metadata, and deletion restrictions.
author: grc-engineering
version: "1.0"
source: github
profile: L2
tags: [rulesets, governance, repository]

references:
  cis: "2.3"
  nist: CM-3
  soc2: CC8.1
  iso27001: A.12.1.2
  hth: "github:2.3"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_org_rulesets
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/rulesets"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      rulesets: "$[*]"

assertions:
  - id: has_active_rulesets
    expr: "size(rulesets.filter(r, r.enforcement == 'active')) >= 1"
    severity: medium
    title: Organization Has Active Rulesets
    pass_message: "Organization has at least one active ruleset configured"
    fail_message: "Organization has no active rulesets configured"
    finding:
      description: |
        No active organization rulesets were found. Organization rulesets
        provide centralized governance over repository settings, branch
        protection, and change management policies. Without rulesets,
        repository owners can bypass organizational standards.
        Configure rulesets in Organization Settings → Repository → Rulesets.

remediation:
  description: |
    Create and activate organization rulesets to enforce consistent
    governance policies across repositories. Rulesets can enforce branch
    protection, require status checks, restrict force pushes, and prevent
    repository deletion.
  steps:
    - "Navigate to github.com/orgs/{{org}}/settings/rules"
    - "Click 'New ruleset'"
    - "Configure target repositories and branches"
    - "Enable desired rules (branch protection, status checks, etc.)"
    - "Set enforcement to 'Active'"
    - "Click 'Create'"
  api:
    method: POST
    url: "https://api.github.com/orgs/{{org}}/rulesets"
    body:
      name: "default-protection"
      enforcement: "active"
      target: "branch"
      bypass_actors: []
      rules:
        - type: "deletion"
        - type: "non_fast_forward"
  cli:
    command: "gh api orgs/{{org}}/rulesets -X POST -f name=default-protection -f enforcement=active -f target=branch"
