id: GH-2.05
name: Enable Branch Protection on Default Branch
description: |
  Verifies that branch protection is enabled on the repository's default
  branch with required pull request reviews and admin enforcement, ensuring
  all changes go through proper review and approval workflows.
author: grc-engineering
version: "1.0"
source: github
profile: L1
tags: [branch-protection, ci-cd, repository]

references:
  cis: "2.1"
  nist: ["CM-3", "CM-5"]
  soc2: CC8.1
  iso27001: ["A.12.1.2", "A.14.2.2"]
  hth: "github:2.1"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [repo]
    required: true

inputs:
  owner:
    description: Repository owner
    env: GITHUB_OWNER
    required: true
  repo:
    description: Repository name
    env: GITHUB_REPO
    required: true

steps:
  - id: get_default_branch
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/repos/{{owner}}/{{repo}}"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      default_branch: "$.default_branch"

  - id: get_branch_protection
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/repos/{{owner}}/{{repo}}/branches/{{default_branch}}/protection"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      404: continue
    extract:
      protection_enabled: "$.url"
      pr_reviews_required: "$.required_pull_request_reviews"
      enforce_admins: "$.enforce_admins.enabled"
      required_status_checks: "$.required_status_checks"

assertions:
  - id: protection_exists
    expr: "protection_enabled != null"
    severity: critical
    title: Branch Protection Exists
    pass_message: "Branch protection is configured on the default branch"
    fail_message: "Branch protection is NOT configured on the default branch"
    finding:
      description: |
        Branch protection is not configured on the default branch. Without
        branch protection, any contributor with write access can push directly
        to the default branch, bypassing code review and CI checks. This
        creates risk of unreviewed or malicious code entering the production
        codebase.

  - id: pr_reviews_enabled
    expr: "pr_reviews_required != null"
    severity: high
    title: Pull Request Reviews Required
    pass_message: "Pull request reviews are required before merging"
    fail_message: "Pull request reviews are NOT required before merging"
    finding:
      description: |
        Pull request reviews are not required on the default branch. Without
        mandatory reviews, changes can be merged without peer review, increasing
        the risk of bugs, security vulnerabilities, and compliance violations.
        Enable required reviews in branch protection settings.

  - id: admin_enforcement
    expr: "enforce_admins == true"
    severity: high
    title: Admin Enforcement Enabled
    pass_message: "Branch protection rules are enforced for administrators"
    fail_message: "Branch protection rules are NOT enforced for administrators"
    finding:
      description: |
        Branch protection rules do not apply to administrators. Admins can
        bypass pull request reviews, status checks, and other protections.
        Enable admin enforcement to ensure consistent security controls
        for all contributors regardless of role.

remediation:
  description: |
    Enable branch protection on the default branch with required pull request
    reviews, admin enforcement, and required status checks. This ensures all
    changes go through proper review and validation workflows.
  steps:
    - "Navigate to github.com/{{owner}}/{{repo}}/settings/branches"
    - "Click 'Add branch protection rule'"
    - "Set branch name pattern to the default branch name"
    - "Enable 'Require a pull request before merging'"
    - "Enable 'Require approvals' with at least 1 reviewer"
    - "Enable 'Include administrators'"
    - "Click 'Create' or 'Save changes'"
  api:
    method: PUT
    url: "https://api.github.com/repos/{{owner}}/{{repo}}/branches/{{default_branch}}/protection"
    body:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
      enforce_admins: true
      required_status_checks: null
      restrictions: null
  cli:
    command: "gh api repos/{{owner}}/{{repo}}/branches/$(gh api repos/{{owner}}/{{repo}} --jq .default_branch)/protection -X PUT -f enforce_admins=true -f 'required_pull_request_reviews[required_approving_review_count]=1'"
