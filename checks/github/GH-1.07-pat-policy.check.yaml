id: GH-1.07
name: Enforce Fine-Grained PAT Policies
description: |
  Verifies that the organization requires approval for fine-grained personal
  access tokens. When enforced, the PAT request endpoint returns 200;
  a 404 or 403 indicates the policy is not active.
author: grc-engineering
version: "1.0"
source: github
profile: L2
tags: [authentication, pat, tokens]

references:
  cis: "1.7"
  nist: ["IA-5", "AC-6"]
  soc2: ["CC6.1", "CC6.2"]
  iso27001: A.9.4.3
  hth: "github:1.7"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org, read:org]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: check_pat_approval_policy
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/personal-access-token-requests?per_page=1"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      "*": continue
    extract:
      pat_policy_status: "$status_code"

assertions:
  - id: pat_approval_enforced
    expr: "pat_policy_status == 200"
    severity: high
    title: Fine-Grained PAT Approval Policy
    pass_message: "Fine-grained PAT approval is enforced — token requests require admin approval"
    fail_message: "Fine-grained PAT approval is not enforced — members can create tokens without approval"
    finding:
      description: |
        The organization does not enforce approval for fine-grained personal
        access tokens. Without this policy, any member can create tokens with
        arbitrary repository and permission scopes. Enforcing PAT approval
        gives administrators visibility and control over token-based access
        to organization resources.

remediation:
  description: |
    Enable the fine-grained personal access token approval policy so that
    organization admins must approve token requests before they become active.
  steps:
    - "Navigate to github.com/orgs/{org}/settings/personal-access-tokens"
    - "Under 'Fine-grained personal access tokens', select 'Require administrator approval'"
    - "Optionally restrict which members can create fine-grained tokens"
    - "Click Save"
  manual:
    - "Review pending PAT requests regularly in the organization's token management page"
    - "Establish a policy for maximum token lifetime and required scopes"
    - "Consider restricting classic PATs in favor of fine-grained tokens"
  cli:
    command: "gh api orgs/{{org}}/personal-access-tokens/policy -X PUT -f policy=require_approval"
