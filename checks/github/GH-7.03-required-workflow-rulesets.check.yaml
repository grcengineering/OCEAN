id: GH-7.03
name: Enforce Required Workflows via Organization Rulesets
description: |
  Verifies that at least one active organization ruleset enforces required
  workflows (security scans, dependency review, code quality checks) so
  security gates cannot be bypassed by disabling checks at the repository
  level.
author: grc-engineering
version: "1.0"
source: github
profile: L2
tags: [rulesets, required-workflows, governance, organization]

references:
  nist: ["SA-11", "CM-3"]
  soc2: ["CC7.1", "CC8.1"]
  hth: "github:7.3"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_org_rulesets
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/rulesets"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      rulesets: "$"
      ruleset_count: "$length"

assertions:
  - id: required_workflow_ruleset_active
    expr: >-
      rulesets.exists(rs, rs.enforcement == "active" && has(rs.rules) &&
      rs.rules.exists(r, r.type == "workflows"))
    severity: high
    title: Required Workflows Enforced Org-Wide
    pass_message: "An active organization ruleset requires workflows to pass before merging"
    fail_message: "No active organization ruleset enforces required workflows"
    finding:
      description: |
        No active organization ruleset contains a "Require workflows to pass
        before merging" rule. Repository-level branch protection can be
        disabled by repository admins, so without a centrally managed
        ruleset, security scans, dependency review, and other required
        checks can be silently bypassed on any individual repository.

remediation:
  description: |
    Create central required workflow files (e.g., security-scan.yml,
    dependency-review.yml) in a governance repository, then enforce them
    organization-wide via a ruleset with a "Require workflows to pass
    before merging" rule that repository admins cannot override.
  steps:
    - "Create a .github repository in the organization if it does not exist"
    - "Add required workflow files (security-scan.yml, dependency-review.yml)"
    - "Navigate to github.com/organizations/{{org}}/settings/rules"
    - "Click 'New ruleset' -> 'New branch ruleset', name it 'Required Security Workflows'"
    - "Set target branches to refs/heads/main and refs/heads/master, target repositories to All repositories (excluding .github)"
    - "Under Rules, add 'Require workflows to pass before merging' and select each required workflow"
    - "Set enforcement to Active"
  api:
    method: POST
    url: "https://api.github.com/orgs/{{org}}/rulesets"
    body:
      name: "Required Security Workflows"
      enforcement: "active"
      target: "branch"
      conditions:
        ref_name:
          include: ["refs/heads/main", "refs/heads/master"]
          exclude: []
        repository_name:
          include: ["~ALL"]
          exclude: ["*.github"]
      rules:
        - type: "workflows"
          parameters:
            workflows:
              - path: ".github/workflows/security-scan.yml"
                repository_id: 0
                ref: "refs/heads/main"
              - path: ".github/workflows/dependency-review.yml"
                repository_id: 0
                ref: "refs/heads/main"
  cli:
    command: "gh api orgs/{{org}}/rulesets --jq '.[] | {name, enforcement, id}'"
