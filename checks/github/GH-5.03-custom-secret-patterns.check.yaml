id: GH-5.03
name: Define Custom Secret Scanning Patterns
description: |
  Verifies that the organization has defined custom secret scanning patterns
  to detect organization-specific secrets that are not covered by GitHub's
  built-in pattern library.
author: grc-engineering
version: "1.0"
source: github
profile: L2
tags: [secrets, custom-patterns, organization]

references:
  cis: "5.4"
  nist: SC-28
  soc2: CC6.1
  iso27001: A.10.1.1
  hth: "github:5.4"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_custom_secret_patterns
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/secret-scanning/custom-patterns"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      404: continue
    extract:
      pattern_count: "$length"
      has_custom_patterns: "$length > 0"

assertions:
  - id: custom_patterns_defined
    expr: "has_custom_patterns == true"
    severity: medium
    title: Custom Secret Scanning Patterns
    pass_message: "{{pattern_count}} custom secret scanning pattern(s) defined"
    fail_message: "No custom secret scanning patterns are defined"
    finding:
      description: |
        No custom secret scanning patterns are defined for this organization.
        While GitHub provides built-in patterns for common secret types,
        organizations often use custom API keys, internal tokens, and
        proprietary credential formats that require custom patterns to detect.
        Define custom patterns to catch organization-specific secrets.
        This feature requires GitHub Advanced Security (GHAS).

remediation:
  description: |
    Define custom secret scanning patterns for organization-specific secrets
    such as internal API keys, service tokens, and proprietary credential
    formats not covered by GitHub's built-in patterns.
  steps:
    - "Navigate to github.com/orgs/{{org}}/settings/security_products"
    - "Under Secret scanning, click 'New pattern'"
    - "Define a regex pattern matching your custom secret format"
    - "Add test strings to validate the pattern"
    - "Enable the pattern for the organization"
  api:
    method: POST
    url: "https://api.github.com/orgs/{{org}}/secret-scanning/custom-patterns"
    body:
      name: "custom-pattern"
      pattern: "regex-pattern-here"
  cli:
    command: "gh api orgs/{{org}}/secret-scanning/custom-patterns --jq '.[].name'"
