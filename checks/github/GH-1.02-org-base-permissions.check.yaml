id: GH-1.02
name: Restrict Default Repository Permissions
description: |
  Verifies that the GitHub organization enforces least-privilege defaults
  by restricting the base repository permission to read-only or none.
author: grc-engineering
version: "1.0"
source: github
profile: L1
tags: [access-control, least-privilege, organization]

references:
  cis: "1.2"
  nist: AC-6
  soc2: CC6.2
  iso27001: A.9.4.1
  hth: "github:1.2"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org, read:org]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_org_settings
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      default_permission: "$.default_repository_permission"
      org_name: "$.login"

assertions:
  - id: least_privilege_default
    expr: 'default_permission == "read" || default_permission == "none"'
    severity: high
    title: Default Repository Permission
    pass_message: "Default repository permission is set to '{{default_permission}}'"
    fail_message: "Default repository permission is '{{default_permission}}' — should be 'read' or 'none'"
    finding:
      description: |
        The organization grants '{{default_permission}}' access to all repositories
        by default. This violates the principle of least privilege and may allow
        members to modify or administer repositories without explicit authorization.
        Set the default permission to 'read' or 'none' and grant elevated access
        per-repository or per-team as needed.

remediation:
  description: |
    Set the organization's default repository permission to 'read' or 'none'.
    Existing members will retain any explicit permissions granted via teams
    or direct collaborator access.
  steps:
    - "Navigate to github.com/orgs/{org}/settings/member_privileges"
    - "Under 'Base permissions', select 'Read' or 'No permission'"
    - "Click Save"
  api:
    method: PATCH
    url: "https://api.github.com/orgs/{{org}}"
    body:
      default_repository_permission: "read"
  cli:
    command: "gh api orgs/{{org}} -X PATCH -f default_repository_permission=read"
