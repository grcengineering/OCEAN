id: GH-TEST-04
name: Unsigned Commit Detection
description: |
  Verifies that commit signature enforcement is enabled on the repository's
  default branch, requiring all commits to be signed with a verified GPG,
  SSH, or S/MIME signature. Unsigned commits cannot guarantee author identity,
  making the repository vulnerable to impersonation attacks.
author: grc-engineering
version: "1.0"
source: github
type: active
safety: observable
environment: production
profile: L2
tags: [commit-signing, active-test]

references:
  cis: "2.4"
  nist: SI-7
  hth: "github:2.4"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [repo]
    required: true

inputs:
  owner:
    description: Repository owner
    env: GITHUB_OWNER
    required: true
  repo:
    description: Repository name
    env: GITHUB_REPO
    required: true

steps:
  - id: check_signing_requirement
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/repos/{{owner}}/{{repo}}/branches/main/protection/required_signatures"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      404: continue
    extract:
      signing_enabled: "$.enabled"

assertions:
  - id: signing_required
    expr: "signing_enabled == true"
    severity: high
    title: Commit Signing Required
    pass_message: "Commit signature verification is required on the default branch"
    fail_message: "Commit signature verification is NOT required on the default branch"
    finding:
      description: |
        Commit signature verification is not required on the default branch.
        Without required signatures, unsigned commits can be pushed to the
        repository, making it impossible to verify that commits were authored
        by the claimed committer. This enables impersonation and reduces
        non-repudiation guarantees for the codebase.

remediation:
  description: |
    Enable required commit signing on the default branch to ensure all
    commits are cryptographically verified.
  steps:
    - "Navigate to github.com/{{owner}}/{{repo}}/settings/branches"
    - "Edit the branch protection rule for the default branch"
    - "Enable 'Require signed commits'"
    - "Click 'Save changes'"
    - "Ensure all contributors have configured GPG or SSH commit signing"
  api:
    method: POST
    url: "https://api.github.com/repos/{{owner}}/{{repo}}/branches/main/protection/required_signatures"
    headers:
      Accept: application/vnd.github+json
