id: GH-5.02
name: Audit Outside Collaborators
description: |
  Reviews outside collaborators with access to organization repositories.
  Outside collaborators are users who are not members of the organization
  but have been granted access to one or more repositories.
author: grc-engineering
version: "1.0"
source: github
profile: L1
tags: [collaborators, access-control, audit]

references:
  nist: AC-6
  soc2: CC6.2
  iso27001: A.9.2.1

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org, read:org]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_outside_collaborators
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/outside_collaborators?per_page=100"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
      paginate: true
    extract:
      collaborator_count: "$length"
      collaborator_logins: "$[*].login"

assertions:
  - id: outside_collaborator_count
    expr: "collaborator_count == 0"
    severity: medium
    title: Outside Collaborator Access
    pass_message: "No outside collaborators found in the organization"
    fail_message: "{{collaborator_count}} outside collaborator(s) have access to organization repositories"
    finding:
      description: |
        Outside collaborators were found with access to organization
        repositories. These users are not organization members and may
        represent an elevated access risk. Review each collaborator to
        ensure their access is still required and appropriately scoped.
        Consider converting long-term collaborators to organization members
        where appropriate.

remediation:
  description: |
    Review all outside collaborators and remove access for those who no
    longer require it. Convert long-term collaborators to organization
    members to enforce organization-wide security policies.
  steps:
    - "Navigate to github.com/orgs/{{org}}/outside_collaborators"
    - "Review each outside collaborator and their repository access"
    - "Remove collaborators who no longer require access"
    - "Consider converting active collaborators to organization members"
  api:
    method: DELETE
    url: "https://api.github.com/orgs/{{org}}/outside_collaborators/{username}"
  cli:
    command: "gh api orgs/{{org}}/outside_collaborators --paginate --jq '.[].login'"
