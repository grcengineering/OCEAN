id: GH-3.05
name: Protect Deployment Environments
description: |
  Verifies that all deployment environments in a repository have protection rules
  configured, including required reviewers to prevent unauthorized deployments.
author: grc-engineering
version: "1.0"
source: github
profile: L1
tags: [environments, deployment, secrets]

references:
  cis: "5.1"
  nist: SC-12
  soc2: CC6.1
  pci_dss: "8.2.1"
  hth: "github:5.1"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [repo]
    required: true

inputs:
  owner:
    description: Repository owner (user or organization)
    env: GITHUB_OWNER
    required: true
  repo:
    description: Repository name
    env: GITHUB_REPO
    required: true

steps:
  - id: get_environments
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/repos/{{owner}}/{{repo}}/environments"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      total_count: "$.total_count"
      environments: "$.environments"
      environment_names: "$.environments[*].name"
      protection_rules: "$.environments[*].protection_rules"

assertions:
  - id: environments_protected
    expr: 'environments.all(e, e.protection_rules.exists(r, r.type == "required_reviewers"))'
    severity: high
    title: Environment Protection Rules
    pass_message: "All environments have required reviewers configured"
    fail_message: "One or more environments lack required reviewers protection"
    finding:
      description: |
        Deployment environments without required reviewers allow any workflow
        run to deploy to that environment without human approval. This can lead
        to unauthorized deployments of untested or malicious code to production
        or other sensitive environments. Configure required reviewers for all
        environments to enforce a human-in-the-loop approval before deployment.

remediation:
  description: |
    Add protection rules with required reviewers to all deployment environments.
    This ensures that deployments require explicit human approval before executing,
    preventing unauthorized or accidental releases.
  steps:
    - "Navigate to github.com/{owner}/{repo}/settings/environments"
    - "For each environment, click the environment name"
    - "Check 'Required reviewers' and add appropriate team members or teams"
    - "Optionally configure wait timer and deployment branch restrictions"
    - "Click Save protection rules"
  api:
    method: PUT
    url: "https://api.github.com/repos/{{owner}}/{{repo}}/environments/{environment_name}"
    body:
      reviewers:
        - type: "Team"
          id: 1
      deployment_branch_policy:
        protected_branches: true
        custom_branch_policies: false
  cli:
    command: "gh api repos/{{owner}}/{{repo}}/environments --jq '.environments[] | {name, protection_rules}'"
