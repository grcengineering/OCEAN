id: GH-4.02
name: Audit GitHub App Installations
description: |
  Reviews GitHub App installations for the organization. A high number of
  installed apps increases the attack surface and should be periodically
  audited to ensure only necessary integrations are active.
author: grc-engineering
version: "1.0"
source: github
profile: L1
tags: [github-apps, permissions, audit]

references:
  cis: "4.2"
  nist: AC-6
  soc2: CC6.2
  iso27001: A.9.2.1
  hth: "github:4.2"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_installed_apps
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/installations"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      installed_app_count: "$.total_count"
      app_slugs: "$.installations[*].app_slug"

assertions:
  - id: app_count_threshold
    expr: "installed_app_count <= 10"
    severity: low
    title: GitHub App Installation Count
    pass_message: "Organization has {{installed_app_count}} installed apps (within threshold)"
    fail_message: "Organization has {{installed_app_count}} installed apps (exceeds threshold of 10)"
    finding:
      description: |
        The organization has more than 10 GitHub Apps installed. Each installed
        app has API access to organization resources based on its granted
        permissions. A high number of installations increases the supply-chain
        attack surface. Review installed apps and remove any that are no longer
        needed or actively used.

remediation:
  description: |
    Review all installed GitHub Apps and remove any that are unnecessary.
    Each app should have the minimum permissions required for its function.
  steps:
    - "Navigate to github.com/orgs/{{org}}/settings/installations"
    - "Review each installed GitHub App and its permissions"
    - "Uninstall apps that are no longer needed"
    - "Verify remaining apps use minimum required permissions"
  api:
    method: DELETE
    url: "https://api.github.com/orgs/{{org}}/installations/{installation_id}"
  cli:
    command: "gh api orgs/{{org}}/installations --jq '.installations[].app_slug'"
