id: GH-3.01
name: Restrict Actions to Verified Creators
description: |
  Verifies that the GitHub organization restricts which GitHub Actions are
  allowed to run, preventing use of unverified or potentially malicious actions.
author: grc-engineering
version: "1.0"
source: github
profile: L1
tags: [actions, supply-chain, organization]

references:
  cis: "3.1"
  nist: SA-12
  soc2: CC9.2
  iso27001: A.14.2.7

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org, read:org]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_actions_permissions
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/actions/permissions"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      allowed_actions: "$.allowed_actions"
      enabled_repositories: "$.enabled_repositories"

assertions:
  - id: actions_restricted
    expr: 'allowed_actions != "all"'
    severity: high
    title: Actions Restricted to Verified Creators
    pass_message: "Allowed actions policy is set to '{{allowed_actions}}'"
    fail_message: "Allowed actions policy is 'all' — must be 'selected' or 'local_only'"
    finding:
      description: |
        The organization allows all GitHub Actions to run without restriction.
        This permits any third-party or unverified action to execute in workflows,
        increasing the risk of supply-chain attacks through malicious actions.
        Restrict allowed actions to 'selected' (verified creators and specific actions)
        or 'local_only' (only actions defined within the organization).

remediation:
  description: |
    Restrict GitHub Actions to verified creators or organization-only actions.
    This limits the attack surface by preventing unreviewed third-party actions
    from executing in CI/CD workflows.
  steps:
    - "Navigate to github.com/orgs/{org}/settings/actions"
    - "Under 'Actions permissions', select 'Allow select actions' or 'Only local actions'"
    - "If using 'Allow select actions', check 'Allow actions created by GitHub' and 'Allow actions by Marketplace verified creators'"
    - "Click Save"
  api:
    method: PUT
    url: "https://api.github.com/orgs/{{org}}/actions/permissions"
    body:
      allowed_actions: "selected"
      enabled_repositories: "all"
  cli:
    command: "gh api orgs/{{org}}/actions/permissions -X PUT -f allowed_actions=selected -f enabled_repositories=all"
