id: GH-2.04
name: Enforce Commit Signing
description: |
  Verifies that commit signature verification is required on the specified
  branch, ensuring all commits are cryptographically signed with GPG or
  SSH keys to prove author identity and prevent tampering.
author: grc-engineering
version: "1.0"
source: github
profile: L2
tags: [commit-signing, gpg, ssh, repository]

references:
  cis: "2.4"
  nist: SI-7
  soc2: CC8.1
  iso27001: A.14.2.7

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [repo]
    required: true

inputs:
  owner:
    description: Repository owner
    env: GITHUB_OWNER
    required: true
  repo:
    description: Repository name
    env: GITHUB_REPO
    required: true
  branch:
    description: Branch to check for signing requirements
    default: main
    required: false

steps:
  - id: get_signing_requirements
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/repos/{{owner}}/{{repo}}/branches/{{branch}}/protection/required_signatures"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      404: continue
    extract:
      signing_enabled: "$.enabled"

assertions:
  - id: commit_signing_required
    expr: "signing_enabled == true"
    severity: medium
    title: Commit Signing Required
    pass_message: "Commit signing is required on the {{branch}} branch"
    fail_message: "Commit signing is NOT required on the {{branch}} branch"
    finding:
      description: |
        Commit signature verification is not required on this branch.
        Without required signing, unsigned or falsely attributed commits
        can be merged, making it impossible to verify author identity
        or detect supply chain tampering. Enable required signatures
        in branch protection settings.

remediation:
  description: |
    Enable required commit signing on the branch protection rule.
    All contributors must configure GPG or SSH signing before they
    can push or merge commits to the protected branch.
  steps:
    - "Navigate to github.com/{{owner}}/{{repo}}/settings/branches"
    - "Edit the branch protection rule for '{{branch}}'"
    - "Enable 'Require signed commits'"
    - "Click Save changes"
  api:
    method: POST
    url: "https://api.github.com/repos/{{owner}}/{{repo}}/branches/{{branch}}/protection/required_signatures"
    body: {}
  cli:
    command: "gh api repos/{{owner}}/{{repo}}/branches/{{branch}}/protection/required_signatures -X POST"
