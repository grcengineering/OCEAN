id: GH-5.01
name: Audit Organization Webhooks
description: |
  Reviews organization-level webhooks for insecure configurations.
  Verifies that all webhooks use HTTPS URLs and have secrets configured
  to validate payload authenticity.
author: grc-engineering
version: "1.0"
source: github
profile: L1
tags: [webhooks, organization, audit]

references:
  nist: SC-8
  soc2: CC6.1
  hth: "github:none"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org_hook]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_org_webhooks
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/hooks"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    extract:
      webhook_count: "$length"
      webhooks: "$[*]"

assertions:
  - id: webhooks_use_https
    expr: "webhooks.all(w, has(w.config) && has(w.config.url) && w.config.url.startsWith('https://'))"
    severity: high
    title: Webhooks Use HTTPS
    pass_message: "All organization webhooks use HTTPS URLs"
    fail_message: "One or more webhooks do not use HTTPS"
    finding:
      description: |
        One or more organization webhooks are configured with non-HTTPS URLs.
        Webhook payloads sent over HTTP are transmitted in plaintext and can
        be intercepted by attackers. All webhooks should use HTTPS endpoints
        to ensure payload confidentiality and integrity.

  - id: webhooks_ssl_verification
    expr: "webhooks.all(w, !has(w.config) || !has(w.config.insecure_ssl) || w.config.insecure_ssl != '1')"
    severity: medium
    title: Webhook SSL Verification
    pass_message: "All organization webhooks have SSL verification enabled"
    fail_message: "One or more webhooks have SSL verification disabled"
    finding:
      description: |
        One or more organization webhooks have SSL verification disabled
        (insecure_ssl = 1). This allows connections to endpoints with
        invalid or self-signed certificates, making the webhook vulnerable
        to man-in-the-middle attacks. Enable SSL verification for all webhooks.

remediation:
  description: |
    Update all organization webhooks to use HTTPS URLs with SSL verification
    enabled. Configure webhook secrets to validate payload authenticity.
  steps:
    - "Navigate to github.com/orgs/{{org}}/settings/hooks"
    - "For each webhook, ensure the Payload URL uses https://"
    - "Enable SSL verification for all webhooks"
    - "Configure a webhook secret for payload validation"
  api:
    method: PATCH
    url: "https://api.github.com/orgs/{{org}}/hooks/{hook_id}"
    body:
      config:
        url: "https://example.com/webhook"
        content_type: "json"
        insecure_ssl: "0"
        secret: "{webhook_secret}"
  cli:
    command: "gh api orgs/{{org}}/hooks --jq '.[].config | {url, insecure_ssl}'"
