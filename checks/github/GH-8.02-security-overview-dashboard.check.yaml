id: GH-8.02
name: Use Security Overview Dashboard
description: |
  Queries organization-wide security alert summaries (Dependabot, secret
  scanning, code scanning) to verify no critical or high-severity alerts
  are open across the organization, mirroring the consolidated view the
  Security Overview dashboard provides.
author: grc-engineering
version: "1.0"
source: github
profile: L1
tags: [security-overview, dependabot, secret-scanning, code-scanning, organization]

references:
  cis: "7.5"
  nist: ["RA-5", "SI-4"]
  soc2: ["CC7.1", "CC7.2"]
  hth: "github:8.2"

credentials:
  GITHUB_TOKEN:
    type: api_token
    scopes: [admin:org, security_events]
    required: true

inputs:
  org:
    description: GitHub organization name
    env: GITHUB_ORG
    required: true

steps:
  - id: get_dependabot_alert_summary
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/dependabot/alerts?state=open&severity=critical,high&per_page=100"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      "*": continue
    extract:
      dependabot_alert_count: "$length"

  - id: get_secret_scanning_alert_summary
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/secret-scanning/alerts?state=open&per_page=100"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      "*": continue
    extract:
      secret_scanning_alert_count: "$length"

  - id: get_code_scanning_alert_summary
    action: api_call
    request:
      method: GET
      url: "https://api.github.com/orgs/{{org}}/code-scanning/alerts?state=open&severity=critical,error&per_page=100"
      headers:
        Authorization: "Bearer {{GITHUB_TOKEN}}"
        Accept: application/vnd.github+json
        X-GitHub-Api-Version: "2022-11-28"
    on_error:
      "*": continue
    extract:
      code_scanning_alert_count: "$length"

assertions:
  - id: no_critical_dependabot_alerts_org_wide
    expr: "dependabot_alert_count == 0"
    severity: high
    title: No Org-Wide Critical/High Dependabot Alerts
    pass_message: "No open critical or high severity Dependabot alerts across the organization"
    fail_message: "{{dependabot_alert_count}} open critical/high Dependabot alert(s) across the organization"
    finding:
      description: |
        One or more repositories in the organization have open critical or
        high severity Dependabot alerts. Without organization-wide
        visibility via the Security Overview dashboard, these alerts can go
        unnoticed until a repository owner happens to check their own
        repository. Review github.com/orgs/{{org}}/security/dependabot and
        remediate the highest-severity findings first.

  - id: no_open_secret_scanning_alerts_org_wide
    expr: "secret_scanning_alert_count == 0"
    severity: critical
    title: No Org-Wide Open Secret Scanning Alerts
    pass_message: "No open secret scanning alerts across the organization"
    fail_message: "{{secret_scanning_alert_count}} open secret scanning alert(s) across the organization"
    finding:
      description: |
        One or more repositories in the organization have open secret
        scanning alerts, indicating a credential or token is exposed in
        Git history. Active credentials should be treated as already
        compromised — revoke and rotate first, then investigate.

  - id: no_critical_code_scanning_alerts_org_wide
    expr: "code_scanning_alert_count == 0"
    severity: high
    title: No Org-Wide Critical Code Scanning Alerts
    pass_message: "No open critical code scanning alerts across the organization"
    fail_message: "{{code_scanning_alert_count}} open critical code scanning alert(s) across the organization"
    finding:
      description: |
        One or more repositories in the organization have open
        critical-severity code scanning alerts. These typically indicate
        exploitable vulnerabilities such as SQL injection, remote code
        execution, or authentication bypass, and should be triaged
        immediately via the Security Overview dashboard.

remediation:
  description: |
    Use the organization Security Overview dashboard to triage and
    remediate open alerts, prioritizing critical and high severity
    findings, and secret scanning alerts above all else.
  steps:
    - "Navigate to github.com/orgs/{{org}} -> Security tab"
    - "Filter by severity: address Critical and High first"
    - "Filter by alert type: address secret scanning alerts immediately (active credentials)"
    - "Filter by repository to identify the highest-risk repositories"
    - "Track mean time to remediation and open critical alert count as ongoing metrics"
  cli:
    command: "gh api orgs/{{org}}/dependabot/alerts?state=open\\&severity=critical,high --jq 'length'"
