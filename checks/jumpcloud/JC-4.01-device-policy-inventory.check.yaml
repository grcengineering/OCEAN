id: JC-4.01
name: Inventory Device Policies for Compliance Review
description: |
  Retrieves the organization's full list of device (system) policies as an
  informational audit. This is an inventory of what exists, not a
  bright-line pass/fail — per-device compliance status for each policy
  requires a separate policystatuses lookup per policy ID and is out of
  scope for this check; the reviewer cross-references the returned policy
  set against the organization's documented device-hardening baseline.
author: grc-engineering
version: "1.0"
source: jumpcloud
profile: L1
tags: [device-management, policy, audit]

references:
  cis: "4.1"
  nist: "CM-7"
  hth: "jumpcloud:4.1"

credentials:
  JUMPCLOUD_API_KEY:
    type: api_token
    required: true

steps:
  - id: get_policies
    action: api_call
    request:
      method: GET
      url: "https://console.jumpcloud.com/api/v2/policies"
      headers:
        x-api-key: "{{JUMPCLOUD_API_KEY}}"
    extract:
      policies: "$[*]"
      policy_count: "$length"

assertions:
  - id: device_policy_inventory
    expr: "get_policies_status_code == 200"
    severity: medium
    title: Device Policy Inventory
    pass_message: "{{policy_count}} device policy(ies) retrieved — cross-reference against the documented hardening baseline"
    fail_message: "The Policies API call did not return 200 — the device policy inventory could not be retrieved"
    finding:
      description: |
        This is an informational audit of every device policy configured in
        the organization. Cross-reference the returned policy names against
        the organization's documented device-hardening baseline (disk
        encryption, screen lock timeout, firewall enabled, OS patch level,
        etc.) and confirm each policy's per-device compliance status in the
        JumpCloud console, since per-policy compliance counts require a
        separate lookup per policy ID.

remediation:
  description: |
    Create policies covering every control in the organization's
    device-hardening baseline and investigate non-compliant devices for
    each existing policy.
  steps:
    - "Navigate to Device Management -> Policy Management"
    - "For each control in the hardening baseline without a matching policy, create one and bind it to the relevant device group"
    - "For each existing policy, open its Policy Status tab and remediate devices reporting a non-success status"
  manual:
    - "Review the policy inventory quarterly and retire policies bound to no device group"
