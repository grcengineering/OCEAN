id: OL-5.01
name: Verify Event Audit Logging Is Actively Capturing Events
description: |
  Mints an OAuth client-credentials token, then queries the Events v1 API
  for the most recent events. A workspace with audit logging genuinely
  active should return recent events; zero events indicates logging is not
  capturing activity even if the feature appears configured.
author: grc-engineering
version: "1.0"
source: onelogin
profile: L1
tags: [audit-logging, monitoring]

references:
  cis: "8.2"
  nist: AU-2
  hth: "onelogin:5.1"

credentials:
  ONELOGIN_CLIENT_ID:
    type: api_token
    required: true
  ONELOGIN_CLIENT_SECRET:
    type: api_token
    required: true

inputs:
  onelogin_subdomain:
    description: OneLogin account subdomain (e.g. mycompany for mycompany.onelogin.com)
    env: ONELOGIN_SUBDOMAIN
    required: true

steps:
  - id: mint_token
    action: api_call
    request:
      method: POST
      url: "https://{{onelogin_subdomain}}.onelogin.com/auth/oauth2/v2/token"
      headers:
        Content-Type: application/x-www-form-urlencoded
      body_form:
        grant_type: client_credentials
        client_id: "{{ONELOGIN_CLIENT_ID}}"
        client_secret: "{{ONELOGIN_CLIENT_SECRET}}"
    extract:
      access_token: "$.access_token"

  - id: get_recent_events
    action: api_call
    request:
      method: GET
      url: "https://{{onelogin_subdomain}}.onelogin.com/api/1/events?limit=50&sort=-id"
      headers:
        Authorization: "bearer:{{access_token}}"
    extract:
      events: "$.data"

assertions:
  - id: audit_log_active
    expr: "size(events) > 0"
    severity: high
    title: Event Audit Log Is Actively Capturing Events
    pass_message: "The Events API returned recent events, confirming active audit logging"
    fail_message: "The Events API returned zero recent events"
    finding:
      description: |
        The OneLogin Events v1 API (api/1/events) returned zero events on
        the most recent page. OneLogin is the authentication gateway for
        every integrated application, so without comprehensive event
        logging, account compromise and admin abuse can occur undetected
        and cannot be investigated after the fact. Confirm logging is
        enabled and that the querying credential has permission to read
        events, and export events to a SIEM for correlation and long-term
        retention.

remediation:
  description: |
    Confirm event capture is active and export events to a SIEM for
    correlation, alerting, and retention beyond the platform's native
    window.
  steps:
    - "Navigate to Activity -> Events and confirm recent login and admin events are visible"
    - "Navigate to Settings -> SIEM Integration and configure log export (Splunk, AWS S3, or a custom webhook)"
    - "Verify log delivery reaches the configured destination"
  manual:
    - "Configure alerts for failed logins, admin configuration changes, MFA enrollment changes, and user provisioning/deprovisioning"
