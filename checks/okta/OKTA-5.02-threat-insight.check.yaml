id: OKTA-5.02
name: Enable ThreatInsight
description: |
  Verifies that Okta ThreatInsight is enabled and actively protecting
  against credential-based attacks. ThreatInsight aggregates data across
  the Okta customer base to detect and block malicious IP addresses
  before they can attempt authentication.
author: grc-engineering
version: "1.0"
source: okta
profile: L1
tags: [threat-detection, security]

references:
  nist: SI-4
  soc2: CC7.2
  hth: "okta:5.2"

credentials:
  OKTA_API_TOKEN:
    type: api_token
    scopes: [okta.users.read, okta.policies.read]
    required: true

inputs:
  okta_domain:
    description: Okta organization domain (e.g., company.okta.com)
    env: OKTA_DOMAIN
    required: true

steps:
  - id: get_threat_insight_config
    action: api_call
    request:
      method: GET
      url: "https://{{okta_domain}}/api/v1/threats/configuration"
      headers:
        Authorization: "SSWS {{OKTA_API_TOKEN}}"
    extract:
      action: "$.action"

assertions:
  - id: threat_insight_enabled
    expr: "action != 'none'"
    severity: high
    title: ThreatInsight Enabled
    pass_message: "ThreatInsight is enabled with action: {{action}}"
    fail_message: "ThreatInsight is disabled (action: none)"
    finding:
      description: |
        Okta ThreatInsight is not enabled. ThreatInsight uses aggregated
        threat intelligence across the Okta network to detect and block
        malicious IP addresses attempting credential-based attacks such as
        credential stuffing and password spraying. Enable ThreatInsight in
        audit or block mode to protect against these threats.

remediation:
  description: |
    Enable ThreatInsight to protect against credential-based attacks.
    Start with "audit" mode to evaluate impact before switching to "block".
  steps:
    - "Navigate to Okta Admin Console → Security → General"
    - "Scroll to 'Okta ThreatInsight Settings'"
    - "Select 'Log and enforce security' (block) or 'Log authentication attempts' (audit)"
    - "Click 'Save'"
  api:
    method: POST
    url: "https://{{okta_domain}}/api/v1/threats/configuration"
    body:
      action: "audit"
