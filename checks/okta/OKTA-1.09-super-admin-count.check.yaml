id: OKTA-1.09
name: Limit Super Admin Count
description: |
  Verifies that the number of Super Admin role assignments does not exceed
  the recommended maximum of 3. Excessive super admin accounts increase the
  blast radius of a credential compromise and violate the principle of least
  privilege. Organizations should minimize standing super admin access and
  use lower-privileged roles for day-to-day administration.
author: grc-engineering
version: "1.0"
source: okta
profile: L1
tags: [governance, admin, privilege]

references:
  nist: AC-6(1)
  soc2: CC6.3
  hth: "okta:7.3"

credentials:
  OKTA_API_TOKEN:
    type: api_token
    scopes: [okta.users.read, okta.roles.read]
    required: true

inputs:
  okta_domain:
    description: Okta organization domain (e.g., company.okta.com)
    env: OKTA_DOMAIN
    required: true
  max_super_admins:
    description: Maximum allowed number of super admin accounts
    default: "3"
    required: false

steps:
  - id: get_super_admin_role
    action: api_call
    request:
      method: GET
      url: "https://{{okta_domain}}/api/v1/iam/roles?type=SUPER_ADMIN"
      headers:
        Authorization: "SSWS {{OKTA_API_TOKEN}}"
    extract:
      super_admin_role_id: "$[0].id"

  - id: get_super_admin_users
    action: api_call
    request:
      method: GET
      url: "https://{{okta_domain}}/api/v1/iam/roles/{{super_admin_role_id}}/users"
      headers:
        Authorization: "SSWS {{OKTA_API_TOKEN}}"
    extract:
      super_admins: "$"
      super_admin_count: "$.length"

assertions:
  - id: super_admin_count_limited
    expr: "super_admin_count <= max_super_admins"
    severity: high
    title: Super Admin Count Within Limit
    pass_message: "Super admin count ({{super_admin_count}}) is within the allowed maximum of {{max_super_admins}}"
    fail_message: "Super admin count ({{super_admin_count}}) exceeds the allowed maximum of {{max_super_admins}}"
    finding:
      description: |
        The organization has {{super_admin_count}} Super Admin accounts, which
        exceeds the recommended maximum of {{max_super_admins}}. Super Admins
        have unrestricted access to all Okta administration functions including
        the ability to modify security policies, manage all users, and configure
        integrations. Each additional super admin account increases the attack
        surface and the risk of unauthorized changes. Follow the principle of
        least privilege by assigning scoped admin roles instead.

remediation:
  description: |
    Review all Super Admin role assignments and reduce the count to 3 or fewer.
    Reassign users to scoped admin roles (Org Admin, App Admin, Help Desk Admin)
    based on their actual job responsibilities.
  steps:
    - "Navigate to Okta Admin Console → Security → Administrators"
    - "Filter by role type 'Super Admin'"
    - "Review each super admin assignment for business justification"
    - "Reassign users to appropriate scoped admin roles (e.g., Org Admin, App Admin)"
    - "Remove the Super Admin role from users who do not require it"
    - "Document the remaining super admin assignments with business justification"
  api:
    method: DELETE
    url: "https://{{okta_domain}}/api/v1/users/{{user_id}}/roles/{{role_id}}"
    body: {}
