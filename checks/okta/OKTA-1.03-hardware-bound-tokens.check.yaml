id: OKTA-1.03
name: Verify Hardware-Bound Session Tokens (FastPass)
description: |
  Verifies that the Okta Verify authenticator is enabled and active, which
  enables Okta FastPass for hardware-bound, device-trust-based session
  tokens. Hardware-bound tokens cannot be replayed from a different device,
  closing the HAR-file session-theft path used in the October 2023 Okta
  support-portal breach.
author: grc-engineering
version: "1.0"
source: okta
profile: L2
tags: [session-security, device-trust, fastpass]

references:
  nist: ["SC-23", "IA-11"]
  hth: "okta:1.3"

credentials:
  OKTA_API_TOKEN:
    type: api_token
    scopes: [okta.authenticators.read]
    required: true

inputs:
  okta_domain:
    description: Okta organization domain (e.g., company.okta.com)
    env: OKTA_DOMAIN
    required: true

steps:
  - id: get_authenticators
    action: api_call
    request:
      method: GET
      url: "https://{{okta_domain}}/api/v1/authenticators"
      headers:
        Authorization: "SSWS {{OKTA_API_TOKEN}}"
    extract:
      authenticators: "$[*]"

assertions:
  - id: okta_verify_fastpass_active
    expr: "size(authenticators.filter(a, a.key == 'okta_verify' && a.status == 'ACTIVE')) > 0"
    severity: high
    title: Okta Verify (FastPass) Authenticator Active
    pass_message: "Okta Verify authenticator is active — hardware-bound FastPass sessions are available"
    fail_message: "Okta Verify authenticator is not active — hardware-bound session tokens are unavailable"
    finding:
      description: |
        The Okta Verify authenticator is not configured or not active, which
        means Okta FastPass cannot bind sessions to a specific device. Without
        device-bound sessions, stolen session cookies (e.g., exfiltrated via
        HAR files, as in the October 2023 Okta support breach) remain fully
        replayable from any device. Enable Okta Verify and configure FastPass
        with user verification to bind sessions to trusted, enrolled devices.

remediation:
  description: |
    Enable Okta Verify with FastPass and require device trust for
    authentication policies.
  steps:
    - "Navigate to Okta Admin Console → Security → Authenticators"
    - "Click Okta Verify → Edit"
    - "Enable Okta FastPass and set 'User verification with Okta FastPass' to Required"
    - "Navigate to Security → Device Integrations and configure device trust for managed devices"
    - "Create an authentication policy rule that denies or steps up access when device trust is not satisfied"
  manual:
    - "Confirm managed-device coverage (Jamf, Intune, Workspace ONE) before enforcing device trust broadly"
    - "Pilot with a small group before org-wide rollout"
