id: OKTA-6.01
name: Review Password Policy
description: |
  Reviews the Okta password policy to verify that minimum password length
  and complexity requirements meet security standards. Weak password policies
  increase the risk of credential compromise through brute-force and
  dictionary attacks.
author: grc-engineering
version: "1.0"
source: okta
profile: L1
tags: [password, policy, authentication]

references:
  nist: IA-5(1)
  soc2: CC6.1
  pci_dss: "8.3.6"

credentials:
  OKTA_API_TOKEN:
    type: api_token
    scopes: [okta.users.read, okta.policies.read]
    required: true

inputs:
  okta_domain:
    description: Okta organization domain (e.g., company.okta.com)
    env: OKTA_DOMAIN
    required: true

steps:
  - id: get_password_policy
    action: api_call
    request:
      method: GET
      url: "https://{{okta_domain}}/api/v1/policies?type=PASSWORD"
      headers:
        Authorization: "SSWS {{OKTA_API_TOKEN}}"
    extract:
      policies: "$[*]"
      min_length: "$[0].settings.password.complexity.minLength"
      complexity: "$[0].settings.password.complexity"

assertions:
  - id: password_min_length
    expr: "min_length >= 12"
    severity: high
    title: Password Minimum Length
    pass_message: "Password minimum length is {{min_length}} characters — meets requirement"
    fail_message: "Password minimum length is {{min_length}} characters — below the required 12"
    finding:
      description: |
        The password policy minimum length is set to {{min_length}} characters,
        which is below the recommended minimum of 12 characters. Short passwords
        are more susceptible to brute-force and dictionary attacks. Update the
        password policy to require at least 12 characters, aligned with NIST
        SP 800-63B guidelines.

remediation:
  description: |
    Update the password policy to require a minimum length of 12 characters
    and appropriate complexity requirements.
  steps:
    - "Navigate to Okta Admin Console → Security → Authentication → Password"
    - "Select the default password policy"
    - "Set minimum password length to 12 or greater"
    - "Review complexity requirements (uppercase, lowercase, number, symbol)"
    - "Click 'Update Policy'"
  manual:
    - "Consider adopting NIST SP 800-63B guidance: longer passwords over complexity rules"
    - "Enable common password checking to block known compromised passwords"
    - "Review password policy annually"
