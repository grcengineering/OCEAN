id: ANTH-7.04
name: Verify Claude Code Developer Metrics Are Being Captured
description: |
  Queries the Admin API's Claude Code usage report
  (GET /v1/organizations/usage_report/claude_code) for the prior day and
  verifies user-level activity records are being returned. A workspace
  where Claude Code is genuinely in use but the analytics endpoint
  returns zero records indicates the monitoring pipeline that tool
  acceptance rates and cost governance depend on is not capturing data.
author: grc-engineering
version: "1.0"
source: anthropic-claude
profile: L1
tags: [monitoring, claude-code, audit-logging]

references:
  nist: [AU-6, SI-4]
  soc2: CC7.2
  hth: "claude-code:5.1"

credentials:
  ANTHROPIC_ADMIN_KEY:
    type: api_token
    required: true

inputs:
  report_date:
    description: Date (YYYY-MM-DD) to query Claude Code analytics for — should be a date with expected developer activity
    env: ANTHROPIC_REPORT_DATE
    required: true

steps:
  - id: get_claude_code_analytics
    action: api_call
    request:
      method: GET
      url: "https://api.anthropic.com/v1/organizations/usage_report/claude_code?starting_at={{report_date}}&limit=100"
      headers:
        x-api-key: "{{ANTHROPIC_ADMIN_KEY}}"
        anthropic-version: "2023-06-01"
    extract:
      records: "$.data"

assertions:
  - id: claude_code_metrics_active
    expr: "size(records) > 0"
    severity: medium
    title: Claude Code Analytics Are Actively Capturing Developer Activity
    pass_message: "The Claude Code usage report returned activity records for the queried date"
    fail_message: "The Claude Code usage report returned zero records for the queried date"
    finding:
      description: |
        The Claude Code analytics endpoint returned no user activity
        records for the queried date. If Claude Code is in active use in
        the organization, this indicates the developer-metrics pipeline
        is not capturing data — the tool-acceptance-rate and cost
        governance controls documented in this guide depend on this
        feed being populated. Confirm the queried date had expected
        developer activity and that the Admin API key has organization
        scope.

remediation:
  description: |
    Confirm Claude Code developer activity is flowing into the Admin
    API's usage reporting.
  steps:
    - "Verify Claude Code is installed and in active use by developers on the queried date"
    - "Confirm the Admin API key used has organization-level scope, not a workspace-scoped key"
    - "Re-query with a date known to have developer activity"
  manual:
    - "Set up a recurring pull of this endpoint into your BI/SIEM tooling so gaps are caught automatically rather than at audit time"
