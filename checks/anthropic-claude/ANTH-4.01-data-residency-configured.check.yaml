id: ANTH-4.01
name: Enforce Data Residency Configuration on Every Workspace
description: |
  Lists organization workspaces via the Admin API
  (GET /v1/organizations/workspaces) and flags any workspace without an
  explicit workspace_geo setting. Workspaces without a configured data
  residency setting default to the platform's standard routing rather
  than an operator-reviewed geographic restriction, which matters for
  regulated data that must not leave a specific jurisdiction.
author: grc-engineering
version: "1.0"
source: anthropic-claude
profile: L2
tags: [data-residency, workspace, data-protection]

references:
  nist: [SC-7, "SA-9(5)"]
  soc2: [CC6.6, P6.1]
  hth: "anthropic-api:3.1"

credentials:
  ANTHROPIC_ADMIN_KEY:
    type: api_token
    required: true

steps:
  - id: get_workspaces
    action: api_call
    request:
      method: GET
      url: "https://api.anthropic.com/v1/organizations/workspaces?limit=100"
      headers:
        x-api-key: "{{ANTHROPIC_ADMIN_KEY}}"
        anthropic-version: "2023-06-01"
    extract:
      workspaces: "$.data"

assertions:
  - id: all_workspaces_have_data_residency_configured
    expr: >-
      size(workspaces.filter(w, !has(w.archived_at) &&
        (!has(w.settings) || !has(w.settings.workspace_geo) ||
         w.settings.workspace_geo == ""))) == 0
    severity: medium
    title: Every Active Workspace Has an Explicit Data Residency Setting
    pass_message: "Every active workspace has an explicit workspace_geo data residency setting configured"
    fail_message: "One or more active workspaces have no explicit data residency setting"
    finding:
      description: |
        At least one active (non-archived) workspace has no explicit
        workspace_geo setting. Without a reviewed data residency
        configuration, that workspace's inference traffic is subject to
        the platform's default routing rather than an operator-approved
        geographic restriction — a gap for any organization with data
        residency or sovereignty requirements.

remediation:
  description: |
    Configure an explicit data residency setting on every active
    workspace that handles regulated or geographically-restricted data.
  steps:
    - "Navigate to console.anthropic.com -> select workspace -> Settings -> Data Residency"
    - "Set the workspace geography and, where required, restrict allowed inference geographies"
  api:
    method: POST
    url: "https://api.anthropic.com/v1/organizations/workspaces/{{workspace_id}}"
    headers:
      x-api-key: "{{ANTHROPIC_ADMIN_KEY}}"
      anthropic-version: "2023-06-01"
    body:
      settings:
        default_inference_geo: "us"
        allowed_inference_geos: ["us"]
  manual:
    - "Confirm the configured residency matches the jurisdiction commitments made to the data owner for each workspace"
