id: ANTH-3.02
name: Limit Workspace Administrator Count
description: |
  Lists the membership of a specific workspace via the Admin API
  (GET /v1/organizations/workspaces/{workspace_id}/members) and flags an
  excessive number of workspace_admin members. Workspace admins can manage
  membership and API keys within the workspace boundary — an inflated
  workspace-admin population widens the blast radius of a single
  compromised account within that workspace.
author: grc-engineering
version: "1.0"
source: anthropic-claude
profile: L1
tags: [rbac, workspace, least-privilege]

references:
  nist: [AC-2, AC-6]
  soc2: [CC6.2, CC6.3]
  hth: "anthropic-api:2.2"

credentials:
  ANTHROPIC_ADMIN_KEY:
    type: api_token
    required: true

inputs:
  workspace_id:
    description: Anthropic workspace ID to audit (wrkspc_...)
    env: ANTHROPIC_WORKSPACE_ID
    required: true

steps:
  - id: get_workspace_members
    action: api_call
    request:
      method: GET
      url: "https://api.anthropic.com/v1/organizations/workspaces/{{workspace_id}}/members?limit=100"
      headers:
        x-api-key: "{{ANTHROPIC_ADMIN_KEY}}"
        anthropic-version: "2023-06-01"
    extract:
      members: "$.data"

assertions:
  - id: workspace_admin_count_within_limit
    expr: 'size(members.filter(m, m.workspace_role == "workspace_admin")) <= 2'
    severity: medium
    title: Workspace Admin Count Is Within Recommended Limit
    pass_message: "The number of workspace_admin members in this workspace is within the recommended limit (<=2)"
    fail_message: "More than 2 members hold the workspace_admin role in this workspace"
    finding:
      description: |
        More than two members of this workspace hold the workspace_admin
        role. Workspace admins can add and remove members and manage API
        keys scoped to the workspace — an inflated workspace-admin
        population widens the blast radius of a single compromised
        account within the workspace boundary.

remediation:
  description: |
    Reduce the workspace_admin population in this workspace to the
    smallest set of accounts with a documented business need.
  steps:
    - "Navigate to console.anthropic.com -> select workspace -> Settings -> Members"
    - "Review every workspace_admin and confirm a documented business justification"
    - "Downgrade members without justification to workspace_developer or workspace_user"
  api:
    method: POST
    url: "https://api.anthropic.com/v1/organizations/workspaces/{{workspace_id}}/members/{{user_id}}"
    headers:
      x-api-key: "{{ANTHROPIC_ADMIN_KEY}}"
      anthropic-version: "2023-06-01"
    body:
      workspace_role: "workspace_developer"
  manual:
    - "Review workspace membership quarterly across every workspace in the organization, not only this one"
