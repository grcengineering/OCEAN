id: SLACK-5.01
name: Verify Audit Logs Are Actively Capturing Events
description: |
  Verifies that the Slack Audit Logs API is enabled and returning event
  entries, confirming Enterprise Grid audit logging is active. Unlike
  Slack's Web API methods, the Audit Logs API does not use the
  {"ok": true/false} envelope — its response is a bare
  {"entries": [...], "response_metadata": {...}} object.
author: grc-engineering
version: "1.0"
source: slack
profile: L1
tags: [audit-logs, monitoring, siem]

references:
  cis: "8.2"
  nist: [AU-2, AU-3, AU-6]
  soc2: CC7.2
  hth: "slack:5.1"

credentials:
  SLACK_AUDIT_TOKEN:
    type: api_token
    scopes: ["auditlogs:read"]
    required: true

steps:
  - id: get_audit_logs
    action: api_call
    request:
      method: GET
      url: "https://api.slack.com/audit/v1/logs?limit=100"
      headers:
        Authorization: "Bearer {{SLACK_AUDIT_TOKEN}}"
        Content-Type: application/json
    extract:
      entries: "$.entries"

assertions:
  - id: audit_logging_active
    expr: "size(entries) > 0"
    severity: high
    title: Slack Audit Logs Capturing Events
    pass_message: "Audit Logs API returned {{entries}} recent entries — audit logging is active"
    fail_message: "Audit Logs API returned zero entries"
    finding:
      description: |
        The Slack Audit Logs API (audit/v1/logs) returned zero entries.
        This either means the Audit Logs feature is not available on the
        current plan (it requires Enterprise Grid), the token lacks the
        auditlogs:read scope, or no auditable activity has been recorded.
        Without an active, populated audit trail, admin actions,
        authentication events, and data access are not visible for
        incident investigation, threat detection, or compliance evidence.
        Confirm the organization is on Enterprise Grid and that log export
        or SIEM integration is configured.

remediation:
  description: |
    Confirm Enterprise Grid audit logging is enabled and export logs to a
    SIEM or log management platform for continuous monitoring.
  steps:
    - "Navigate to Enterprise Grid Admin -> Security -> Audit logs"
    - "Confirm log categories (user actions, workspace settings, app installations, file access, channel management) are populated"
    - "Configure log export to an S3 bucket or direct SIEM API integration"
    - "Set export frequency to real-time or a defined schedule"
    - "Configure the Audit Logs API with a token holding the auditlogs:read scope for programmatic SIEM ingestion"
  manual:
    - "Configure SIEM alerts for critical events such as role_change_to_admin and repeated user_login_failed entries"
