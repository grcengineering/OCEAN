id: VERCEL-1.05
name: Enforce Git Fork Protection Across All Projects
description: |
  Verifies that every project in the team has Git Fork Protection enabled.
  Without it, a pull request opened from a fork of the repository can run
  with the project's preview-environment secrets, letting an external
  contributor exfiltrate credentials through a crafted PR.
author: grc-engineering
version: "1.0"
source: vercel
profile: L1
tags: [supply-chain, git, ci-cd, oauth]

references:
  nist: ["AC-6", "SA-12", "CM-8"]
  hth: "vercel:1.5"

credentials:
  VERCEL_TOKEN:
    type: api_token
    required: true

inputs:
  vercel_team_id:
    description: Vercel team ID (starts with "team_")
    env: VERCEL_TEAM_ID
    required: true

steps:
  - id: get_projects
    action: api_call
    request:
      method: GET
      url: "https://api.vercel.com/v10/projects?teamId={{vercel_team_id}}&limit=100"
      headers:
        Authorization: "Bearer {{VERCEL_TOKEN}}"
    extract:
      projects: "$.projects"

assertions:
  - id: all_projects_have_fork_protection
    expr: "size(projects.filter(p, p.gitForkProtection != true)) == 0"
    severity: high
    title: All Projects Have Git Fork Protection Enabled
    pass_message: "All projects have gitForkProtection enabled"
    fail_message: "One or more projects do not have gitForkProtection enabled"
    finding:
      description: |
        At least one project does not have gitForkProtection enabled. Without
        it, deployments triggered by pull requests from forks run with access
        to the project's preview-environment environment variables, so a
        malicious or compromised fork PR can exfiltrate secrets through a
        crafted build step. This is the exact class of exposure documented in
        Vercel's April 2026 security bulletin, where a compromised third-party
        OAuth token enabled lateral movement into Vercel's internal
        environment.

remediation:
  description: |
    Enable Git Fork Protection on every flagged project and maintain a
    quarterly inventory of third-party integrations and OAuth grants.
  steps:
    - "Navigate to Project -> Settings -> Git"
    - "Enable 'Fork Protection' for each flagged project"
    - "Navigate to Team Settings -> Integrations and review installed Marketplace integrations for ones no longer in active use"
    - "Navigate to Team Settings -> Git and review connected Git accounts (GitHub/GitLab/Bitbucket) for stale or unused links"
  manual:
    - "Extend the audit into each identity provider that issues OAuth trust to Vercel-adjacent vendors: Google Workspace (admin.google.com -> Security -> API Controls -> Third-party app access), the GitHub organization's installed OAuth/GitHub Apps, Microsoft Entra ID Enterprise applications, and Slack's installed apps"
    - "Review deploy hooks per project quarterly — each hook URL is an unauthenticated trigger and should be treated as a credential"
