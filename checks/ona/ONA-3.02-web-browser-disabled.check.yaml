id: ONA-3.02
name: In-Environment Web Browser Disabled
description: |
  Verifies that the built-in in-environment web browser is disabled, read from
  `OrganizationPolicies.webBrowserDisabled` via
  `gitpod.v1.OrganizationService/GetOrganizationPolicies`.

  Why it matters. The built-in browser panel gives whatever runs inside an
  environment — a member, or an agent acting on a member's behalf — an
  interactive HTTP client that renders and executes pages from inside your
  environment's network position. That is an egress and data-movement path that
  bypasses the browser controls on the member's own laptop: no corporate
  extension, no proxy, no DLP inspection of what gets pasted into a form.

  What the toggle does NOT cover. The vendor is explicit: "web_browser_disabled
  controls whether users can open the built-in web browser from environment
  pages. This does not affect VS Code Browser." Disabling it closes one panel, not
  every browsing surface an environment offers, and this check asserts nothing
  about the other.

  Host, proto3 omission, and abstention follow the design documented in full on
  ONA-1.02: `app.gitpod.io` because `app.ona.com` 308-redirects and clients drop
  the bearer; Protobuf-JSON omits false booleans, so an organization with the
  browser enabled returns a policies object with no `webBrowserDisabled` key at
  all — this was the live shape on a real tenant, where the eleven returned keys
  did not include it; and every assertion is guarded from the always-bound
  response root down, so an unreadable organization ABSTAINS rather than being
  accused. `has(policies.webBrowserDisabled)` is tested before the value is
  compared, so absence is a clean FAIL — the insecure default — and never a CEL
  error.
author: grc-engineering
version: "1.0"
source: ona
profile: L2
tags: [environment, egress, data-exfiltration, organization, proto3]

references:
  cis: ["9.2"]
  nist: ["SC-7", "AC-4"]
  soc2: CC6.6
  iso27001: A.13.1.1
  hth: "ona:3.2"

credentials:
  ONA_TOKEN:
    type: api_token
    scopes: [read-only]
    required: true

inputs:
  org:
    description: >-
      Ona organization UUID. Obtain it with
      `POST /api/gitpod.v1.IdentityService/GetAuthenticatedIdentity` and an empty
      JSON body `{}`.
    env: ONA_ORGANIZATION_ID
    required: true

steps:
  - id: get_org_policies
    action: api_call
    note: >-
      Connect RPC unary call. Addressed at app.gitpod.io rather than the
      documented app.ona.com because the latter 308-redirects and clients drop
      the bearer on the hop. Unknown request fields are rejected, so the body
      carries `organizationId` only.
    request:
      method: POST
      url: "https://app.gitpod.io/api/gitpod.v1.OrganizationService/GetOrganizationPolicies"
      headers:
        Authorization: "Bearer {{ONA_TOKEN}}"
        Content-Type: application/json
        Accept: application/json
      body:
        organizationId: "{{org}}"
    extract:
      # Always-bound reachability anchors. `jsonpath_extract` returns the body
      # verbatim for `$` before attempting any navigation, and answers
      # `$is_object` for every body shape, so both names are bound on EVERY
      # response — including the ones where nothing else is. Every guard below is
      # written against them, walking down from the root, so no clause is ever
      # reached with an unnavigable receiver.
      #
      # `$is_object` rather than `!$is_array` because `has()` is blind to shape:
      # cel-interpreter 0.10.0 answers `has(scalar.field)` with FALSE, not an
      # error, which is indistinguishable from a well-formed object that simply
      # omits the key. Those need opposite verdicts — Protobuf-JSON omits empty
      # repeated fields, so an object missing the key is a readable EMPTY result
      # and a real finding, while a scalar body was never a response at all and
      # must abstain.
      body_root: "$"
      body_is_object: "$is_object"
      policies: "$.policies"

assertions:
  - id: policies_readable
    expr: "get_org_policies_status_code == 200 && body_root != null && body_is_object && has(body_root.policies)"
    severity: info
    title: Organization Policies Readable
    pass_message: "GetOrganizationPolicies returned a policies object for organization '{{org}}'; the web-browser verdict below was actually evaluated"
    fail_message: "GetOrganizationPolicies returned no policies object for '{{org}}' (HTTP {{status_code}}) — nothing was read, so the verdict below abstains and asserts nothing in either direction"
    finding:
      description: |
        The Ona API did not return an organization policies object, so no setting
        was observed. This is a collection failure, not a compliance failure.
        Check ONA_ORGANIZATION_ID against
        `IdentityService/GetAuthenticatedIdentity`, confirm the token is live and
        issued from the same management-plane domain, and confirm the principal
        holds the permission GetOrganizationPolicies requires.

  - id: web_browser_disabled
    expr: "get_org_policies_status_code != 200 || body_root == null || !body_is_object || !has(body_root.policies) || (has(policies.webBrowserDisabled) && policies.webBrowserDisabled == true)"
    severity: medium
    title: In-Environment Web Browser
    pass_message: "No enabled in-environment browser was observed for '{{org}}' — this row is evidence that the built-in browser is disabled ONLY if 'Organization Policies Readable' above also passed; when the policies object could not be read it abstains and asserts nothing about the browser"
    fail_message: "The built-in in-environment web browser is ENABLED for '{{org}}' — environments carry an interactive HTTP client that sits outside your endpoint browsing controls"
    finding:
      description: |
        `webBrowserDisabled` is not true, so members can open the built-in browser
        panel from environment pages. Anything running in the environment — the
        member, or an agent acting for them — then has an interactive, rendering
        HTTP client operating from the environment's network position rather than
        from a managed endpoint: no corporate extension, no proxy interception, no
        inspection of what is pasted into a page.
        Scope limit, stated by the vendor: this toggle "does not affect VS Code
        Browser". Turning it off closes one panel, not every browsing surface, so
        treat it as one layer alongside egress controls at the runner and the agent
        command deny list (ONA-2.02).
        Note on the read: an ABSENT field is the insecure default. Protobuf-JSON
        omits false booleans, so a policies object with no `webBrowserDisabled` key
        means the browser is enabled. This check treats absence as a failure
        deliberately.
        This finding cannot be raised by an unreadable organization — the guard
        chain short-circuits to abstain on non-200, a null body, an array-shaped
        body, or a missing `policies` key.

remediation:
  description: |
    Set `webBrowserDisabled: true`. `UpdateOrganizationPolicies` returns a message
    with NO fields, so the write is never self-proving — read back with
    `GetOrganizationPolicies` and assert on the read-back. This check IS that
    read-back.
  steps:
    - "Navigate to Settings -> Infrastructure -> Policies -> Environment access"
    - "Turn off 'Web browser — Allow members to open the built-in browser panel'"
    - "Save, re-open the page, and confirm the toggle persisted"
    - "Re-run this check and confirm `webBrowserDisabled` reads true"
  api:
    method: POST
    url: "https://app.gitpod.io/api/gitpod.v1.OrganizationService/UpdateOrganizationPolicies"
    headers:
      Authorization: "Bearer {{ONA_TOKEN}}"
      Content-Type: application/json
    body:
      organizationId: "{{ONA_ORGANIZATION_ID}}"
      webBrowserDisabled: true
  manual:
    - "VS Code Browser is unaffected by this policy — pair the change with runner-level egress controls if the goal is to constrain browsing generally."
    - "Ona ships no first-party CLI verb for the organization policies object; `ona organization security-policy ...` covers SecurityPolicy objects only."
