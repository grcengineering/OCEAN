id: ONA-2.01
name: A Security Policy Is Assigned as the Organization Default
description: |
  Verifies that a `SecurityPolicy` is assigned as the organization default, read
  from `OrganizationPolicies.securityPolicyId` via
  `gitpod.v1.OrganizationService/GetOrganizationPolicies`.

  Why assignment is the thing to check, not creation. The vendor states it
  outright: "Creation stores an inactive definition; assigning it as the
  organization default validates materializability." A created SecurityPolicy
  does NOTHING until `UpdateOrganizationPolicies.securityPolicyId` names it, and
  the authoritative materializability check runs at assignment, not at create. An
  organization can hold a carefully authored Veto Exec policy and be entirely
  unprotected by it. `securityPolicyId` is the only field that distinguishes the
  two states, so it is what this check reads. ONA-2.01b covers the other half:
  that the policies which exist actually carry executable rules.

  Two coexisting Veto surfaces. Ona ships `SecurityPolicy.spec.executables`
  (`SecurityService`, effects `EFFECT_ALLOW`/`_BLOCK`/`_AUDIT`) AND an inline
  `OrganizationPolicies.vetoExecPolicy` (`{enabled, executables[], action}` with
  `KERNEL_CONTROLS_ACTION_BLOCK`/`_AUDIT`) — different enums for the same idea,
  both live. This check asserts on the SecurityPolicy assignment because that is
  the surface the vendor's own runbook and CLI are written against. The inline
  policy is read as evidence, not asserted on; the live tenant returned
  `vetoExecPolicy: {"safelist": [...six paths...]}` with no `enabled` key, which
  is the disabled default carrying only its server-populated safelist.

  The safelist trap, worth knowing before remediating. `vetoExecPolicy.safelist`
  is "Output only. Executable paths that are protected by the safelist and cannot
  be blocked by the denylist. Populated by the server from the built-in default
  safelist. Ignored on update requests." A deny rule naming a safelisted binary
  is silently inert — it will neither error nor take effect.

  Host, proto3 omission, and abstention follow the design documented in full on
  ONA-1.02: `app.gitpod.io` because `app.ona.com` 308-redirects and clients drop
  the bearer; Protobuf-JSON omits empty strings, so an organization with no
  assigned policy returns a policies object with no `securityPolicyId` key at
  all — this was the live shape; and every assertion is guarded from the
  always-bound response root down, so an unreadable organization ABSTAINS rather
  than being accused. `has(policies.securityPolicyId)` is tested before the value
  is compared, so absence is a clean FAIL — the insecure default — and never a
  CEL error.

  Plan gating. Veto Exec is Enterprise-only. On a lower plan
  `GetOrganizationPolicies` still returns successfully with no `securityPolicyId`,
  so this reports a real gap the operator cannot remediate without a plan change,
  rather than abstaining and hiding it. The finding says so explicitly.
author: grc-engineering
version: "1.0"
source: ona
profile: L2
tags: [agent-governance, veto-exec, security-policy, organization, proto3]

references:
  cis: ["2.5", "2.7"]
  nist: ["CM-7", "SI-3"]
  soc2: CC6.8
  iso27001: A.12.5.1
  hth: "ona:2.1"

credentials:
  ONA_TOKEN:
    type: api_token
    scopes: [read-only]
    required: true

inputs:
  org:
    description: >-
      Ona organization UUID. Obtain it with
      `POST /api/gitpod.v1.IdentityService/GetAuthenticatedIdentity` and an empty
      JSON body `{}`.
    env: ONA_ORGANIZATION_ID
    required: true

steps:
  - id: get_org_policies
    action: api_call
    note: >-
      Connect RPC unary call. Addressed at app.gitpod.io rather than the
      documented app.ona.com because the latter 308-redirects and clients drop
      the bearer on the hop. Unknown request fields are rejected, so the body
      carries `organizationId` only.
    request:
      method: POST
      url: "https://app.gitpod.io/api/gitpod.v1.OrganizationService/GetOrganizationPolicies"
      headers:
        Authorization: "Bearer {{ONA_TOKEN}}"
        Content-Type: application/json
        Accept: application/json
      body:
        organizationId: "{{org}}"
    extract:
      # Always-bound reachability anchors. `jsonpath_extract` returns the body
      # verbatim for `$` before attempting any navigation, and answers
      # `$is_object` for every body shape, so both names are bound on EVERY
      # response — including the ones where nothing else is. Every guard below is
      # written against them, walking down from the root, so no clause is ever
      # reached with an unnavigable receiver.
      #
      # `$is_object` rather than `!$is_array` because `has()` cannot itself
      # discriminate shape: on a non-object receiver cel 0.14 RAISES ("No such
      # overload"), which the fail-closed default turns into an accusation,
      # while it answers FALSE for a well-formed object that simply
      # omits the key. Those need opposite verdicts — Protobuf-JSON omits empty
      # repeated fields, so an object missing the key is a readable EMPTY result
      # and a real finding, while a scalar body was never a response at all and
      # must abstain.
      body_root: "$"
      body_is_object: "$is_object"
      policies: "$.policies"
      # The coexisting inline surface, read as evidence only — see the description.
      veto_exec_policy: "$.policies.vetoExecPolicy"

assertions:
  - id: policies_readable
    expr: "get_org_policies_status_code == 200 && body_root != null && body_is_object && has(body_root.policies)"
    severity: info
    title: Organization Policies Readable
    pass_message: "GetOrganizationPolicies returned a policies object for organization '{{org}}'; the security-policy verdict below was actually evaluated"
    fail_message: "GetOrganizationPolicies returned no policies object for '{{org}}' (HTTP {{status_code}}) — nothing was read, so the verdict below abstains and asserts nothing in either direction"
    finding:
      description: |
        The Ona API did not return an organization policies object, so no setting
        was observed. This is a collection failure, not a compliance failure.
        Check ONA_ORGANIZATION_ID against
        `IdentityService/GetAuthenticatedIdentity`, confirm the token is live and
        issued from the same management-plane domain, and confirm the principal
        holds the permission GetOrganizationPolicies requires.

  - id: security_policy_assigned
    expr: "get_org_policies_status_code != 200 || body_root == null || !body_is_object || !has(body_root.policies) || (has(policies.securityPolicyId) && policies.securityPolicyId != '')"
    severity: high
    title: Organization Default Security Policy
    pass_message: "No unassigned-security-policy gap was observed for '{{org}}' — this row is evidence that a default SecurityPolicy is assigned ONLY if 'Organization Policies Readable' above also passed; when the policies object could not be read it abstains and asserts nothing about policy assignment"
    fail_message: "No SecurityPolicy is assigned as the organization default for '{{org}}' — any Veto executable rules that exist are stored but inert"
    finding:
      description: |
        `securityPolicyId` is empty or absent, so no SecurityPolicy is the
        organization default. This is the failure mode the vendor warns about
        directly: "Creation stores an inactive definition; assigning it as the
        organization default validates materializability." A policy can be
        authored, reviewed, and created cleanly, and still enforce nothing. If your
        organization believes it has Veto Exec in place, this finding is the
        evidence that it does not.
        Remediate by assigning, not by re-creating. `ona organization
        security-policy set-default <policy-id>` takes a POLICY ID, never a
        filename — passing the YAML file to `set-default` is a documented
        mis-reading of the vendor runbook. The id comes back from `create`.
        Two things assignment does not do. Running environments keep the policy
        they had at their last start, so restart them. And `set-default --clear`
        is not an undo for executable rules — it "removes every control in that
        SecurityPolicy", so the documented rollback is to flip each rule back to
        EFFECT_AUDIT and update.
        Plan gating: Veto Exec is Enterprise-only. On a lower plan this read
        succeeds and reports the gap honestly; remediation requires a plan change,
        not just a configuration change.
        Note on the read: an ABSENT field is the insecure default. Protobuf-JSON
        omits empty strings, so a policies object with no `securityPolicyId` key
        means nothing is assigned. This check treats absence as a failure
        deliberately.
        This finding cannot be raised by an unreadable organization — the guard
        chain short-circuits to abstain on non-200, a null body, an array-shaped
        body, or a missing `policies` key.

remediation:
  description: |
    Create a SecurityPolicy and then ASSIGN it — the assignment is the step that
    makes it real and the step the management plane actually validates.
    `UpdateOrganizationPolicies` returns a message with NO fields, so the write is
    never self-proving; read back with `GetOrganizationPolicies` and assert on the
    read-back. This check IS that read-back.
  steps:
    - "Author the policy document with every executable rule at EFFECT_AUDIT first — the vendor warns that blocking an interpreter such as /bin/bash also blocks scripts using it and can make an environment unusable"
    - "Validate client-side: `ona organization security-policy init policy.yaml --validate-only`"
    - "Create it: `ona organization security-policy create policy.yaml -o json`, and keep the returned policy id"
    - "Assign it: `ona organization security-policy set-default <security-policy-id>` — this is where the management plane runs its authoritative materializability check"
    - "Prove it: `ona organization security-policy list -o json`, and re-run this check to confirm `securityPolicyId` is non-empty"
    - "Restart existing environments — a running environment keeps the policy from its last start"
  cli:
    command: "ona organization security-policy init policy.yaml --validate-only && ona organization security-policy create policy.yaml -o json && ona organization security-policy set-default \"$ONA_SECURITY_POLICY_ID\""
  api:
    method: POST
    url: "https://app.gitpod.io/api/gitpod.v1.OrganizationService/UpdateOrganizationPolicies"
    headers:
      Authorization: "Bearer {{ONA_TOKEN}}"
      Content-Type: application/json
    body:
      organizationId: "{{ONA_ORGANIZATION_ID}}"
      securityPolicyId: "{{ONA_SECURITY_POLICY_ID}}"
  manual:
    - "The CLI command above is the vendor's documented four-step runbook collapsed to one line; `set-default` takes the id returned by `create`, so run the steps separately in practice and capture the id."
    - "`vetoExecPolicy.safelist` is server-populated and output-only — a deny rule naming a safelisted binary is silently inert."
    - "Ona installs via `brew install gitpod-io/tap/ona`; authenticate with `ona login` rather than passing the token in argv, where it would land on the process table."
