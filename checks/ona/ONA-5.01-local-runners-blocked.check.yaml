id: ONA-5.01
name: Local Runners Are Not Permitted
description: |
  Verifies that the organization does not permit local runners, read from
  `OrganizationPolicies.allowLocalRunners` via
  `gitpod.v1.OrganizationService/GetOrganizationPolicies`.

  Why it matters. A local runner executes environments on a member's own machine.
  Source that your policy says lives on managed infrastructure ends up on an
  endpoint you do not control, outside your network egress controls, and the
  runner-side hardening the rest of this guide assumes — environment classes,
  scoped SCM integrations, security agents — is not present there. The vendor has
  also deprecated local runners at the enum level, so the hardened posture and
  the vendor's direction agree.

  ABSENCE PASSES HERE, and that is the point. Every other policy-backed check in
  this vendor treats a missing field as the insecure default, because Protobuf-JSON
  omits false booleans and the hardened value is `true`. `allowLocalRunners`
  inverts that: the hardened value is FALSE, so an organization that has never
  touched the setting returns a policies object with no `allowLocalRunners` key
  and IS in the desired state. The assertion is written
  `!has(policies.allowLocalRunners) || policies.allowLocalRunners == false` — absence
  short-circuits to a pass. Writing it as `has(...) && ... == false` would fail every
  correctly-configured organization, which is precisely the class of error the
  proto3-omission rule exists to prevent; the rule is "reason about what absence
  MEANS", not "absence always fails".

  A second lever, not asserted. `RUNNER_KIND_LOCAL_CONFIGURATION` is a
  system-managed singleton whose `spec.desiredPhase` "can be set to STOPPED to
  disable all local runners" — an enforcement path independent of this policy. It
  requires enumerating runners with `RunnerService/ListRunners` and is not read
  here, so a pass means the org-level permission is closed, not that a
  previously-started local runner has been stopped.

  Host and abstention follow the design documented in full on ONA-1.02:
  `app.gitpod.io` because `app.ona.com` 308-redirects and clients drop the bearer;
  and every assertion is guarded from the always-bound response root down, so an
  unreadable organization ABSTAINS rather than being accused.
author: grc-engineering
version: "1.0"
source: ona
profile: L2
tags: [runners, deployment-architecture, data-residency, organization, proto3]

references:
  cis: ["12.2"]
  nist: ["SC-7", "SA-9"]
  soc2: CC6.6
  iso27001: A.13.2.1
  hth: "ona:5.1"

credentials:
  ONA_TOKEN:
    type: api_token
    scopes: [read-only]
    required: true

inputs:
  org:
    description: >-
      Ona organization UUID. Obtain it with
      `POST /api/gitpod.v1.IdentityService/GetAuthenticatedIdentity` and an empty
      JSON body `{}`.
    env: ONA_ORGANIZATION_ID
    required: true

steps:
  - id: get_org_policies
    action: api_call
    note: >-
      Connect RPC unary call. Addressed at app.gitpod.io rather than the
      documented app.ona.com because the latter 308-redirects and clients drop
      the bearer on the hop. Unknown request fields are rejected, so the body
      carries `organizationId` only.
    request:
      method: POST
      url: "https://app.gitpod.io/api/gitpod.v1.OrganizationService/GetOrganizationPolicies"
      headers:
        Authorization: "Bearer {{ONA_TOKEN}}"
        Content-Type: application/json
        Accept: application/json
      body:
        organizationId: "{{org}}"
    extract:
      # Always-bound reachability anchors. `jsonpath_extract` returns the body
      # verbatim for `$` before attempting any navigation, and answers
      # `$is_object` for every body shape, so both names are bound on EVERY
      # response — including the ones where nothing else is. Every guard below is
      # written against them, walking down from the root, so no clause is ever
      # reached with an unnavigable receiver.
      #
      # `$is_object` rather than `!$is_array` because `has()` is blind to shape:
      # cel-interpreter 0.10.0 answers `has(scalar.field)` with FALSE, not an
      # error, which is indistinguishable from a well-formed object that simply
      # omits the key. Those need opposite verdicts — Protobuf-JSON omits empty
      # repeated fields, so an object missing the key is a readable EMPTY result
      # and a real finding, while a scalar body was never a response at all and
      # must abstain.
      body_root: "$"
      body_is_object: "$is_object"
      policies: "$.policies"

assertions:
  - id: policies_readable
    expr: "get_org_policies_status_code == 200 && body_root != null && body_is_object && has(body_root.policies)"
    severity: info
    title: Organization Policies Readable
    pass_message: "GetOrganizationPolicies returned a policies object for organization '{{org}}'; the local-runner verdict below was actually evaluated"
    fail_message: "GetOrganizationPolicies returned no policies object for '{{org}}' (HTTP {{status_code}}) — nothing was read, so the verdict below abstains and asserts nothing in either direction"
    finding:
      description: |
        The Ona API did not return an organization policies object, so no setting
        was observed. This is a collection failure, not a compliance failure.
        Check ONA_ORGANIZATION_ID against
        `IdentityService/GetAuthenticatedIdentity`, confirm the token is live and
        issued from the same management-plane domain, and confirm the principal
        holds the permission GetOrganizationPolicies requires.

  - id: local_runners_not_permitted
    expr: "get_org_policies_status_code != 200 || body_root == null || !body_is_object || !has(body_root.policies) || !has(policies.allowLocalRunners) || policies.allowLocalRunners == false"
    severity: medium
    title: Local Runner Permission
    pass_message: "No local-runner permission was observed for '{{org}}' — this row is evidence that local runners are blocked ONLY if 'Organization Policies Readable' above also passed; when the policies object could not be read it abstains and asserts nothing about local runners"
    fail_message: "Local runners are PERMITTED for '{{org}}' — environments can run on members' own machines, outside the infrastructure your runner hardening applies to"
    finding:
      description: |
        `allowLocalRunners` is explicitly true for this organization. Environments
        can therefore run on members' own machines: your source is cloned onto an
        endpoint you do not manage, egress leaves your network entirely, and none
        of the runner-side hardening in this guide — scoped SCM integrations,
        environment classes, security agents — applies to that execution. The
        vendor has deprecated local runners at the enum level, so this is also
        drift from the vendor's own direction.
        Note on the read, and how it differs from every other policy check here:
        ABSENCE PASSES. The hardened value for this field is FALSE, and
        Protobuf-JSON omits false booleans, so an organization that has never
        touched the setting returns no `allowLocalRunners` key and is in the
        desired state. This finding is raised only when the field is present AND
        true.
        A second lever exists that this check does not read:
        `RUNNER_KIND_LOCAL_CONFIGURATION` is a system-managed singleton whose
        `spec.desiredPhase` can be set to STOPPED to disable all local runners.
        Closing the policy stops new ones; check `RunnerService/ListRunners` for
        one that is already running.
        This finding cannot be raised by an unreadable organization — the guard
        chain short-circuits to abstain on non-200, a null body, an array-shaped
        body, or a missing `policies` key.

remediation:
  description: |
    Set `allowLocalRunners: false`. `UpdateOrganizationPolicies` returns a message
    with NO fields, so the write is never self-proving — read back with
    `GetOrganizationPolicies` and assert on the read-back. This check IS that
    read-back.
  steps:
    - "Send the API call below to set `allowLocalRunners: false` — no console toggle for this policy was observed in the live sidebar survey (Settings -> Infrastructure -> Policies covers environment access, lifecycle and setup only), so the API is the reliable path"
    - "Navigate to Settings -> Infrastructure -> Runners and confirm the runner inventory contains only the managed runners you intend"
    - "If a `RUNNER_KIND_LOCAL_CONFIGURATION` runner is already present, set its `spec.desiredPhase` to STOPPED via `RunnerService/UpdateRunner` — closing the policy does not stop a runner that is already running"
    - "Re-run this check and confirm `allowLocalRunners` reads false or is absent"
  api:
    method: POST
    url: "https://app.gitpod.io/api/gitpod.v1.OrganizationService/UpdateOrganizationPolicies"
    headers:
      Authorization: "Bearer {{ONA_TOKEN}}"
      Content-Type: application/json
    body:
      organizationId: "{{ONA_ORGANIZATION_ID}}"
      allowLocalRunners: false
  manual:
    - "Self-hosted AWS/GCP runners are Enterprise-gated (Settings -> Infrastructure -> Runners -> Set up a new runner); blocking local runners without a managed runner in place will stop members creating environments at all."
    - "Ona ships no first-party CLI verb for the organization policies object; `ona organization security-policy ...` covers SecurityPolicy objects only."
