id: ONA-1.04
name: Every Service Account Carries an Expiry
description: |
  Verifies that every non-suspended service account in the organization has a
  `validUntil` timestamp, read from
  `gitpod.v1.ServiceAccountService/ListServiceAccounts`.

  Why the API contract alone is not enough. `validUntil` is marked
  **Required: Yes** on `CreateServiceAccount`, so the contract itself forbids an
  indefinite service account at creation time. That is a reason to expect this
  check to pass, not a reason to skip it: contracts change between API versions,
  accounts created before a constraint was introduced survive it, and
  system-managed accounts follow different rules. A control that is enforced
  upstream still needs evidence that it held for the accounts that actually
  exist. This check is that evidence.

  The unbounded-token gap this does NOT close. `validFor` on
  `CreateServiceAccountToken` is OPTIONAL, so a bounded service account can still
  hold an unbounded TOKEN. Catching that requires reading `expiresAt` from
  `ServiceAccountService/ListServiceAccountTokens`, which is keyed per service
  account and would need one call per account — beyond what a declarative check
  can express here, since OCEAN's step list is static and cannot fan out over a
  prior step's results. A pass here means the accounts are bounded; it does NOT
  mean their tokens are.

  Suspended accounts are excluded, and why. `ServiceAccount.suspended` "indicates
  whether the service account has been deleted (soft-delete). Suspended service
  accounts cannot be used for authentication." A soft-deleted account with no
  expiry is not a live credential, so flagging it would be noise. The filter is
  written inline in the `.all()` predicate rather than as a request filter
  because the request's `includeSuspended` defaults to false already — the
  inline test is belt-and-braces for a server that returns them anyway.

  JSONPath constraint that shaped this check. OCEAN's `jsonpath_extract` resolves
  the array wildcard `$[*].field` only at the ROOT of the body, and
  `navigate_fields` walks objects only — so `$.serviceAccounts[*].validUntil`
  cannot be expressed. The array is therefore extracted whole as
  `$.serviceAccounts` and the per-element test is done in CEL with `.all()`.

  Pagination ceiling. Only the FIRST page is read — OCEAN's `paginate: true`
  follows GitHub-style `Link` headers, which Connect RPC does not emit — with
  `pageSize` at the documented maximum of 100. An organization with more than 100
  service accounts could hold an unbounded one beyond that boundary, so a pass is
  bounded by that ceiling.

  Host, response shape, and abstention. The request goes to `app.gitpod.io`
  because the documented `app.ona.com` base 308-redirects and clients drop the
  `Authorization` header on the hop. The response is a JSON OBJECT with
  `serviceAccounts` nested under it, and Protobuf-JSON OMITS empty repeated
  fields — so an organization with no service accounts returns an object with no
  `serviceAccounts` key. That case PASSES: no service account exists, so none is
  unbounded, and the assertion is vacuously satisfied. An unreadable response
  ABSTAINS via the reachability assertion.
author: grc-engineering
version: "1.0"
source: ona
profile: L2
tags: [identity, service-accounts, credential-lifetime, pagination-ceiling]

references:
  cis: ["5.4", "16.9"]
  nist: ["IA-5", "AC-2"]
  soc2: CC6.1
  iso27001: A.9.2.4
  hth: "ona:1.4"

credentials:
  ONA_TOKEN:
    type: api_token
    scopes: [read-only]
    required: true

inputs:
  org:
    description: >-
      Ona organization UUID, used for message interpolation. ListServiceAccounts
      accepts no organizationId filter — scoping is implicit from the token — so
      this input is not sent in the request body. Obtain it with
      `POST /api/gitpod.v1.IdentityService/GetAuthenticatedIdentity` and body `{}`.
    env: ONA_ORGANIZATION_ID
    required: true

steps:
  - id: list_service_accounts
    action: api_call
    note: >-
      Connect RPC unary call. Addressed at app.gitpod.io rather than the
      documented app.ona.com because the latter 308-redirects and clients drop
      the bearer on the hop. The body carries only `pagination`: this request
      message has no `organizationId` field (its `filter` offers
      `includeSuspended`, `serviceAccountIds` and `search` only), and the Ona API
      rejects unknown request fields. `includeSuspended` defaults to false, so
      soft-deleted accounts are already out of scope. `pageSize` is the documented
      maximum (100); only the first page is read because Connect emits no Link
      header for OCEAN's paginator to follow.
    request:
      method: POST
      url: "https://app.gitpod.io/api/gitpod.v1.ServiceAccountService/ListServiceAccounts"
      headers:
        Authorization: "Bearer {{ONA_TOKEN}}"
        Content-Type: application/json
        Accept: application/json
      body:
        pagination:
          pageSize: 100
    extract:
      # Always-bound reachability anchors. `jsonpath_extract` returns the body
      # verbatim for `$` before attempting any navigation, and answers
      # `$is_object` for every body shape, so both names are bound on EVERY
      # response — including the ones where nothing else is. Every guard below is
      # written against them, walking down from the root, so no clause is ever
      # reached with an unnavigable receiver.
      #
      # `$is_object` rather than `!$is_array` because `has()` is blind to shape:
      # cel-interpreter 0.10.0 answers `has(scalar.field)` with FALSE, not an
      # error, which is indistinguishable from a well-formed object that simply
      # omits the key. Those need opposite verdicts — Protobuf-JSON omits empty
      # repeated fields, so an object missing the key is a readable EMPTY result
      # and a real finding, while a scalar body was never a response at all and
      # must abstain.
      body_root: "$"
      body_is_object: "$is_object"
      # Extracted whole rather than as `$.serviceAccounts[*].validUntil`: OCEAN's
      # JSONPath resolves the array wildcard only at the body root, so the
      # per-element test happens in CEL via `.all()`.
      service_accounts: "$.serviceAccounts"

assertions:
  - id: service_accounts_readable
    expr: "list_service_accounts_status_code == 200 && body_root != null && body_is_object"
    severity: info
    title: Service Accounts Readable
    pass_message: "ListServiceAccounts answered with a response object for the token's organization scope; the expiry verdict below was actually evaluated"
    fail_message: "ListServiceAccounts did not return a readable response (HTTP {{status_code}}) — nothing was read, so the verdict below abstains and asserts nothing in either direction"
    finding:
      description: |
        The Ona API did not return a readable ListServiceAccounts response, so no
        service account was observed. This is a collection failure, not a
        compliance failure.
        Likely causes: service accounts are gated above the free tier, and Connect
        answers a plan-gated feature with HTTP 400 `failed_precondition`; the token
        is expired, revoked, or issued from a different management-plane domain; or
        the principal lacks the permission the method requires.

  - id: every_service_account_expires
    expr: "list_service_accounts_status_code != 200 || body_root == null || !body_is_object || !has(body_root.serviceAccounts) || service_accounts.all(sa, (has(sa.suspended) && sa.suspended == true) || (has(sa.validUntil) && sa.validUntil != ''))"
    severity: medium
    title: Service Account Expiry
    pass_message: "No unbounded service account was observed in the token's organization scope — this row is evidence that every live service account carries an expiry ONLY if 'Service Accounts Readable' above also passed; when the list could not be read it abstains and asserts nothing about expiry"
    fail_message: "At least one live service account in '{{org}}' has no `validUntil` — it is a non-human identity that never expires on its own"
    finding:
      description: |
        A non-suspended service account was returned with no `validUntil`
        timestamp. Service accounts are non-human identities that nobody offboards:
        without an expiry, the credential persists until a person notices it and
        deletes it, which in practice means it persists.
        This is worth investigating rather than dismissing, because
        `CreateServiceAccount` marks `validUntil` **Required: Yes** — the API
        contract forbids creating one this way today. An account without it was
        therefore created before the constraint, is system-managed, or was produced
        by a path that bypasses the documented one. Any of those is a finding worth
        a name.
        What this does NOT cover: the account's TOKENS. `validFor` on
        `CreateServiceAccountToken` is optional, so a bounded account can still hold
        an unbounded token. Read `expiresAt` from
        `ServiceAccountService/ListServiceAccountTokens` for each account to close
        that gap — it needs one call per account and is out of scope for a
        declarative check whose step list is static.
        Suspended accounts are excluded deliberately: `suspended` marks a
        soft-deleted account that "cannot be used for authentication", so an expiry
        on it would be meaningless.
        Read ceiling: only the first page of up to 100 service accounts was read,
        because Connect emits no Link header for OCEAN's paginator to follow.
        This finding cannot be raised by an unreadable response — the guard chain
        short-circuits to abstain on non-200, a null body, or an array-shaped body.
        An organization with no service accounts at all PASSES: absence of the
        `serviceAccounts` key means there is nothing unbounded to find.

remediation:
  description: |
    Service accounts cannot be given an expiry after the fact — `validUntil` is set
    at creation. Replace the unbounded account: create a bounded successor, migrate
    the workload to its token, then delete the original.
  steps:
    - "Navigate to Settings -> Organization -> Members -> Service Accounts and identify the accounts with no expiry"
    - "For each, determine what uses it before deleting anything — a service account with no owner is the most dangerous kind to remove blind"
    - "Create a replacement with `ServiceAccountService/CreateServiceAccount` and an explicit `validUntil` no further out than your credential-rotation interval"
    - "Create its token with `CreateServiceAccountToken` and an explicit `validFor` — this field is OPTIONAL, so omitting it produces an unbounded token on a bounded account"
    - "Migrate the workload, confirm it authenticates, then delete the original with `DeleteServiceAccount`"
    - "Re-run this check and confirm every live account carries `validUntil`"
  api:
    method: POST
    url: "https://app.gitpod.io/api/gitpod.v1.ServiceAccountService/CreateServiceAccount"
    headers:
      Authorization: "Bearer {{ONA_TOKEN}}"
      Content-Type: application/json
    body:
      name: "REPLACE_WITH_SERVICE_ACCOUNT_NAME"
      description: "Bounded replacement for an unbounded service account"
      validUntil: "2027-01-01T00:00:00Z"
  manual:
    - "The `validUntil` above is a placeholder — set it from your rotation interval, not from a round date."
    - "A service account token's value is returned once at creation and never again; capture it into your secret store in the same step."
    - "Ona ships no first-party CLI verb for service accounts; `ona organization security-policy ...` covers SecurityPolicy objects only."
