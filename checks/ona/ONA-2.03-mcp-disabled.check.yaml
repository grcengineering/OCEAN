id: ONA-2.03
name: Model Context Protocol Disabled for Agents
description: |
  Verifies that MCP (Model Context Protocol) is disabled organization-wide, read
  from `OrganizationPolicies.agentPolicy.mcpDisabled` via
  `gitpod.v1.OrganizationService/GetOrganizationPolicies`.

  Why it matters. An MCP server is arbitrary code that an agent may call with the
  agent's own privileges, and its tool descriptions are model-visible text — a
  prompt-injection surface that reaches the agent before any human reviews it.
  `mcpDisabled: true` is the organization-wide off switch.

  A documented exception is legitimate. An organization that curates MCP
  integrations centrally — reviewing each server, pinning its source, and
  enabling it deliberately through `IntegrationService` — has a defensible reason
  to leave MCP on. That is why this check carries MEDIUM severity rather than
  high: a failure here is a prompt to produce the exception record, not an
  automatic defect. Ona exposes the per-integration surface
  (`IntegrationService/ListIntegrations` returns `.enabled`, `.capabilities.mcp`
  and `.categories[]` including `INTEGRATION_CATEGORY_MCP`), so an organization
  taking the exception can evidence its curation there; that enumeration is not
  in scope for this check, which answers the organization-wide toggle only.

  A claim the API does NOT support. The product documentation states that
  `.ona/mcp-config.json` in a repository is ignored when MCP is disabled. No
  field, description, or example on any of the 259 generated API reference pages
  mentions `mcp-config.json`, so that behaviour is not evidenced by the API
  contract and is not asserted here.

  Host, proto3 omission, and abstention follow the design documented in full on
  ONA-1.02: the request goes to `app.gitpod.io` because `app.ona.com`
  308-redirects and clients drop the bearer on the hop; Protobuf-JSON omits false
  booleans, so an organization with MCP enabled returns an `agentPolicy` object
  with no `mcpDisabled` key at all; and every assertion is guarded from the
  always-bound response root down, so an unreadable organization ABSTAINS rather
  than being accused. `has(policies.agentPolicy.mcpDisabled)` is tested before the
  value is compared, so absence is a clean FAIL — the insecure default — and never
  a CEL error.
author: grc-engineering
version: "1.0"
source: ona
profile: L2
tags: [agent-governance, mcp, supply-chain, organization, proto3]

references:
  cis: ["2.5"]
  nist: ["CM-7", "AC-3"]
  soc2: CC6.8
  iso27001: A.12.6.2
  hth: "ona:2.3"

credentials:
  ONA_TOKEN:
    type: api_token
    scopes: [read-only]
    required: true

inputs:
  org:
    description: >-
      Ona organization UUID. Obtain it with
      `POST /api/gitpod.v1.IdentityService/GetAuthenticatedIdentity` and an empty
      JSON body `{}`.
    env: ONA_ORGANIZATION_ID
    required: true

steps:
  - id: get_org_policies
    action: api_call
    note: >-
      Connect RPC unary call. Addressed at app.gitpod.io rather than the
      documented app.ona.com because the latter 308-redirects and clients drop
      the bearer on the hop. Unknown request fields are rejected, so the body
      carries `organizationId` only.
    request:
      method: POST
      url: "https://app.gitpod.io/api/gitpod.v1.OrganizationService/GetOrganizationPolicies"
      headers:
        Authorization: "Bearer {{ONA_TOKEN}}"
        Content-Type: application/json
        Accept: application/json
      body:
        organizationId: "{{org}}"
    extract:
      # Always-bound reachability anchors. `jsonpath_extract` returns the body
      # verbatim for `$` before attempting any navigation, and answers
      # `$is_object` for every body shape, so both names are bound on EVERY
      # response — including the ones where nothing else is. Every guard below is
      # written against them, walking down from the root, so no clause is ever
      # reached with an unnavigable receiver.
      #
      # `$is_object` rather than `!$is_array` because `has()` cannot itself
      # discriminate shape: on a non-object receiver cel 0.14 RAISES ("No such
      # overload"), which the fail-closed default turns into an accusation,
      # while it answers FALSE for a well-formed object that simply
      # omits the key. Those need opposite verdicts — Protobuf-JSON omits empty
      # repeated fields, so an object missing the key is a readable EMPTY result
      # and a real finding, while a scalar body was never a response at all and
      # must abstain.
      body_root: "$"
      body_is_object: "$is_object"
      policies: "$.policies"

assertions:
  - id: policies_readable
    expr: "get_org_policies_status_code == 200 && body_root != null && body_is_object && has(body_root.policies)"
    severity: info
    title: Organization Policies Readable
    pass_message: "GetOrganizationPolicies returned a policies object for organization '{{org}}'; the MCP verdict below was actually evaluated"
    fail_message: "GetOrganizationPolicies returned no policies object for '{{org}}' (HTTP {{status_code}}) — nothing was read, so the verdict below abstains and asserts nothing in either direction"
    finding:
      description: |
        The Ona API did not return an organization policies object, so no setting
        was observed. This is a collection failure, not a compliance failure.
        Check ONA_ORGANIZATION_ID against
        `IdentityService/GetAuthenticatedIdentity`, confirm the token is live and
        issued from the same management-plane domain, and confirm the principal
        holds the permission GetOrganizationPolicies requires.

  - id: mcp_disabled
    expr: "get_org_policies_status_code != 200 || body_root == null || !body_is_object || !has(body_root.policies) || (has(policies.agentPolicy) && has(policies.agentPolicy.mcpDisabled) && policies.agentPolicy.mcpDisabled == true)"
    severity: medium
    title: Organization MCP Policy
    pass_message: "No enabled-MCP exposure was observed for '{{org}}' — this row is evidence that MCP is disabled ONLY if 'Organization Policies Readable' above also passed; when the policies object could not be read it abstains and asserts nothing about MCP"
    fail_message: "MCP is ENABLED organization-wide for '{{org}}' — agents may call MCP servers whose code and tool descriptions your organization has not reviewed"
    finding:
      description: |
        `agentPolicy.mcpDisabled` is not true for this organization, so agents may
        connect to MCP servers. Each server is arbitrary code invoked with the
        agent's privileges, and each server's tool descriptions are text the model
        reads — an injection path that reaches the agent's context before any human
        sees it.
        This is a MEDIUM finding, not a defect by default. An organization that
        curates MCP integrations centrally — reviewing each server, pinning its
        source, and enabling it deliberately through `IntegrationService` — may
        accept this as a documented exception. Evidence the exception with
        `IntegrationService/ListIntegrations`, which returns `.enabled`,
        `.capabilities.mcp` and `.categories[]`; enumerate the enabled MCP
        integrations and record who approved each one and when. If no such record
        exists, close the toggle instead.
        Note on the read: an ABSENT field is the insecure default. Protobuf-JSON
        omits false booleans, so an `agentPolicy` object with no `mcpDisabled` key
        means MCP is enabled. This check treats absence as a failure deliberately.
        The product documentation's claim that `.ona/mcp-config.json` is ignored
        when MCP is disabled is not evidenced anywhere in the API reference and is
        not relied on here.
        This finding cannot be raised by an unreadable organization — the guard
        chain short-circuits to abstain on non-200, a null body, an array-shaped
        body, or a missing `policies` key.

remediation:
  description: |
    Set `agentPolicy.mcpDisabled: true`. `UpdateOrganizationPolicies` returns a
    message with NO fields, so the write is never self-proving — read back with
    `GetOrganizationPolicies` and assert on the read-back. This check IS that
    read-back.
  steps:
    - "Navigate to Settings -> Agents -> Policies"
    - "Under 'Agent capabilities', turn off 'Model Context Protocol (MCP)'"
    - "Save, re-open the page, and confirm the toggle persisted"
    - "If MCP must stay on, instead record the exception: enumerate the enabled MCP integrations under Settings -> Organization -> Integrations and capture the approval for each"
    - "Re-run this check and confirm `mcpDisabled` reads true"
  api:
    method: POST
    url: "https://app.gitpod.io/api/gitpod.v1.OrganizationService/UpdateOrganizationPolicies"
    headers:
      Authorization: "Bearer {{ONA_TOKEN}}"
      Content-Type: application/json
    body:
      organizationId: "{{ONA_ORGANIZATION_ID}}"
      agentPolicy:
        mcpDisabled: true
  manual:
    - "Ona ships no first-party CLI verb for the organization policies object; `ona organization security-policy ...` covers SecurityPolicy objects only."
