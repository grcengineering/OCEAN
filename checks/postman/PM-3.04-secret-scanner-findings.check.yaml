id: PM-3.04
name: Audit Unresolved Secret Scanner Findings
description: |
  Queries the Postman Secret Scanner findings API (POST
  /detected-secrets-queries with resolved:false) and flags any unresolved
  detected-secret finding. Requires Postman Enterprise with the Advanced
  Security Administration add-on; a non-200 response most often means the
  add-on is not licensed for this organization rather than a transient
  failure.
author: grc-engineering
version: "1.0"
source: postman
profile: L1
tags: [secrets, credential-hygiene, scanning]

references:
  cis: "16.4"
  nist: IA-5
  soc2: CC6.1
  hth: "postman:3.4"

credentials:
  POSTMAN_API_KEY:
    type: api_token
    required: true

steps:
  - id: get_unresolved_secret_findings
    action: api_call
    request:
      method: POST
      url: "https://api.getpostman.com/detected-secrets-queries?limit=50"
      headers:
        X-API-Key: "{{POSTMAN_API_KEY}}"
        Content-Type: application/json
      body:
        resolved: false
    extract:
      findings: "$.data"

assertions:
  - id: secret_scanner_api_reachable
    expr: "status_code == 200"
    severity: medium
    title: Secret Scanner Findings API Reachable
    pass_message: "POST /detected-secrets-queries returned successfully — unresolved findings are auditable"
    fail_message: "POST /detected-secrets-queries did not return 200 — confirm the organization has the Advanced Security Administration add-on"
    finding:
      description: |
        The Postman Secret Scanner findings API
        (POST /detected-secrets-queries) did not return a successful
        response. This most commonly means the organization does not have
        the Enterprise Advanced Security Administration add-on that the
        findings API requires, in which case unresolved secret exposure
        cannot be verified programmatically at all.

  - id: no_unresolved_secret_findings
    expr: "size(findings) == 0"
    severity: critical
    title: No Unresolved Secret Scanner Findings
    pass_message: "The Secret Scanner reports zero unresolved detected-secret findings"
    fail_message: "The Secret Scanner has one or more unresolved detected-secret findings"
    finding:
      description: |
        The Postman Secret Scanner has one or more findings with
        resolved:false, meaning a live credential was detected in a
        collection, environment, or connected Git project and has not
        yet been remediated. Once a secret reaches a public workspace,
        automated scrapers can find and abuse it within minutes. Rotate
        every exposed credential immediately, then mark the finding
        resolved once remediation is confirmed.

remediation:
  description: |
    Rotate every credential behind an unresolved finding and confirm
    Secret Scanner coverage matches the organization's workspace types.
  steps:
    - "Navigate to Team Settings -> Security and open the Secret Scanner dashboard"
    - "For each unresolved finding, rotate the exposed credential at its source system immediately"
    - "Mark the finding resolved in Postman only after the credential has been rotated"
    - "Confirm Cloud Secret Detection coverage extends to Internal and Partner workspaces, not only public ones"
  manual:
    - "Configure alert routing so new findings reach the team responsible for credential rotation in near real time"
    - "Add custom detection patterns for credential formats unique to the organization"
