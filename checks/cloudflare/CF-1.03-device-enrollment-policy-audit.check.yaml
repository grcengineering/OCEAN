id: CF-1.03
name: Retrieve Device Enrollment Policy for Review
description: |
  Retrieves the Zero Trust device enrollment policy as an informational
  audit for reviewing which users and rules can enroll a device into
  WARP. This is a retrieval-and-review control rather than a bright-line
  pass/fail: the enrollment policy's include/exclude rules are org-
  specific and the API does not expose a single boolean for "hardened,"
  so the reviewer must cross-reference the returned rules against the
  organization's intended enrollment scope.
author: grc-engineering
version: "1.0"
source: cloudflare
profile: L1
tags: [device-enrollment, zero-trust, audit]

references:
  cis: ["1.4", "5.3"]
  nist: [AC-2]
  hth: "cloudflare:1.3"

credentials:
  CF_API_TOKEN:
    type: api_token
    scopes: [account:read, access:read]
    required: true

inputs:
  cf_account_id:
    description: Cloudflare account ID
    env: CF_ACCOUNT_ID
    required: true

steps:
  - id: get_device_policy
    action: api_call
    request:
      method: GET
      url: "https://api.cloudflare.com/client/v4/accounts/{{cf_account_id}}/devices/policy"
      headers:
        Authorization: "Bearer {{CF_API_TOKEN}}"
    extract:
      policy: "$.result"

assertions:
  - id: device_enrollment_policy_audit
    expr: "get_device_policy_status_code == 200"
    severity: medium
    title: Device Enrollment Policy Retrieved for Review
    pass_message: "Device enrollment policy retrieved — review include/exclude rules against intended enrollment scope"
    fail_message: "The device enrollment policy could not be retrieved"
    finding:
      description: |
        The Zero Trust device enrollment policy endpoint did not return
        200. Without visibility into the enrollment policy, unauthorized
        or rogue devices could enroll into the Zero Trust network using
        only a valid IdP login with no additional restriction. Confirm
        the token holds Zero Trust read access and re-run; once
        reachable, review Settings → WARP Client → Device enrollment for
        the include/exclude rules that should scope enrollment to
        managed devices only.

remediation:
  description: |
    Scope device enrollment to only the users, groups, or countries the
    organization intends to allow, and review the rule list regularly.
  steps:
    - "Navigate to Zero Trust → Settings → WARP Client → Device enrollment"
    - "Add include rules scoping enrollment to the organization's IdP groups or email domains"
    - "Add exclude rules for any users or devices that should never enroll"
    - "Review the enrollment rule list on a recurring schedule as part of access review"
  manual:
    - "Cross-reference the returned include/exclude rules against the organization's documented enrollment scope"
