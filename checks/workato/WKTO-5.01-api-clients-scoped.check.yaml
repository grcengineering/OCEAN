id: WKTO-5.01
name: Verify Every API Platform Client Has a Scoped Access Profile
description: |
  Lists API Platform clients (GET /api/api_clients) and access profiles
  (GET /api/api_access_profiles), then flags any client with no
  associated access profile. An API client with no access profile is not
  scoped to a specific API collection, which means requests authenticated
  with that client's credentials are governed only by whatever default
  access the platform grants rather than an explicit, reviewed scope.
author: grc-engineering
version: "1.0"
source: workato
profile: L2
tags: [api-platform, least-privilege]

references:
  nist: [AC-3, SC-8]
  hth: "workato:5.1"

credentials:
  WORKATO_API_TOKEN:
    type: api_token
    required: true

steps:
  - id: get_api_clients
    action: api_call
    request:
      method: GET
      url: "https://www.workato.com/api/api_clients"
      headers:
        Authorization: "Bearer {{WORKATO_API_TOKEN}}"
    extract:
      clients: "$.result"

  - id: get_access_profiles
    action: api_call
    request:
      method: GET
      url: "https://www.workato.com/api/api_access_profiles"
      headers:
        Authorization: "Bearer {{WORKATO_API_TOKEN}}"
    extract:
      profiles: "$.result"

assertions:
  - id: every_client_has_an_access_profile
    expr: "clients.all(c, profiles.exists(p, p.api_client_id == c.id))"
    severity: high
    title: Every API Client Has at Least One Scoped Access Profile
    pass_message: "Every API Platform client has at least one associated access profile"
    fail_message: "One or more API Platform clients have no associated access profile"
    finding:
      description: |
        At least one API Platform client has no associated access
        profile. Access profiles are how an API client is scoped to a
        specific API collection; a client with no profile is not bound
        to an explicit, reviewed scope. Create an access profile for
        every client that limits it to the API collections it actually
        needs.

remediation:
  description: |
    Create a scoped access profile for every API client that lacks one.
  steps:
    - "Navigate to Workspace Admin -> API Platform -> API Clients"
    - "For each client with no access profile, create one scoped to only the API collections it consumes"
    - "Remove or archive API clients that are no longer in use"
  api:
    method: POST
    url: "https://www.workato.com/api/api_access_profiles"
    headers:
      Authorization: "Bearer {{WORKATO_API_TOKEN}}"
    body:
      name: "{{client_name}}-scoped-profile"
      api_client_id: "{{client_id}}"
      api_collection_ids: []
  manual:
    - "Review the API client and access profile inventory quarterly"
