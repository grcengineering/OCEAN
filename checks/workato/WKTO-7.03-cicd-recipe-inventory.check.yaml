id: WKTO-7.03
name: CI/CD Pipeline Recipe Inventory for a Project Folder
description: |
  Lists recipes in a specific project folder via the Workato API
  (GET /api/recipes?folder_id=...) as an informational audit — this is an
  inventory of what exists, not a bright-line pass/fail. The reviewer
  confirms recipe state and versioning are consistent with the CI/CD
  pipeline's expected stop/deploy/start sequence for that folder.
author: grc-engineering
version: "1.0"
source: workato
profile: L3
tags: [cicd, change-management, audit]

references:
  nist: [SA-10, CM-3]
  hth: "workato:7.3"

credentials:
  WORKATO_API_TOKEN:
    type: api_token
    required: true

inputs:
  folder_id:
    description: Workato project folder ID whose recipes should be audited
    env: WORKATO_FOLDER_ID
    required: true

steps:
  - id: get_recipes
    action: api_call
    request:
      method: GET
      url: "https://www.workato.com/api/recipes?folder_id={{folder_id}}"
      headers:
        Authorization: "Bearer {{WORKATO_API_TOKEN}}"
    extract:
      recipes: "$.result"

assertions:
  - id: recipes_api_reachable
    expr: "status_code == 200"
    severity: medium
    title: CI/CD Folder Recipe Inventory Retrieved
    pass_message: "GET /api/recipes for the folder returned successfully — review recipe state and version against the pipeline's expected sequence"
    fail_message: "GET /api/recipes for the folder did not return 200 — the folder's recipe inventory could not be retrieved"
    finding:
      description: |
        The Workato Recipes API did not return a successful response for
        the queried folder. This is an informational audit of every
        recipe in a CI/CD-managed project folder. Cross-reference each
        recipe's running state and version against your pipeline's
        expected stop-before-deploy, start-after-deploy sequence.

remediation:
  description: |
    Confirm the CI/CD pipeline is stopping recipes before deployment and
    starting them afterward, and that version history matches deployed
    changes.
  manual:
    - "Confirm the pipeline calls PUT /api/recipes/{id}/stop before importing a package and PUT .../start afterward"
    - "Reconcile recipe version history (GET /api/recipes/{id}/versions) against your CI/CD run log"
