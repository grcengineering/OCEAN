id: WKTO-7.02
name: Recipe Lifecycle Management Deployment Inventory
description: |
  Lists deployment packages via the Workato API (GET /api/deployments) as
  an informational audit — this is an inventory of what exists, not a
  bright-line pass/fail. The reviewer confirms every production
  deployment traces back to a reviewed package rather than an ad hoc
  in-place recipe edit.
author: grc-engineering
version: "1.0"
source: workato
profile: L2
tags: [rlcm, change-management, audit]

references:
  nist: [CM-3, SA-10]
  hth: "workato:7.2"

credentials:
  WORKATO_API_TOKEN:
    type: api_token
    required: true

steps:
  - id: get_deployments
    action: api_call
    request:
      method: GET
      url: "https://www.workato.com/api/deployments"
      headers:
        Authorization: "Bearer {{WORKATO_API_TOKEN}}"
    extract:
      deployments: "$.result"

assertions:
  - id: deployments_api_reachable
    expr: "status_code == 200"
    severity: medium
    title: Deployment Package Inventory Retrieved
    pass_message: "GET /api/deployments returned successfully — review each deployment package's state and origin"
    fail_message: "GET /api/deployments did not return 200 — the deployment package inventory could not be retrieved"
    finding:
      description: |
        The Workato Deployments API did not return a successful
        response. This is an informational audit of every deployment
        package recorded for the workspace. Cross-reference each
        deployment's state and creation time against your change-
        management records to confirm production changes are traceable
        to a reviewed package rather than an unreviewed in-place edit.

remediation:
  description: |
    Confirm every production recipe change traces to a recorded
    deployment package.
  manual:
    - "Require Recipe Lifecycle Management for all promotions from development to production"
    - "Reconcile the deployment package inventory against your change-management ticket system quarterly"
