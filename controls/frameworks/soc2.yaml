id: soc2
name: SOC 2 Type II
version: "2017"
controls:
  - ref: CC6.1
    title: Logical and Physical Access Controls
    description: >
      The entity implements logical access security software, infrastructure,
      and architectures over protected information assets to protect them from
      security events to meet the entity's objectives.
    ocean_control_ids:
      - iam.mfa_enforcement
  - ref: CC6.6
    title: System Boundary Protection
    description: >
      The entity implements logical access security measures to protect against
      threats from sources outside its system boundaries.
    ocean_control_ids:
      - network.waf_protection
  - ref: CC6.2
    title: User Authentication
    description: >
      Prior to issuing system credentials and granting system access, the entity
      registers and authorizes new internal and external users.
    ocean_control_ids:
      - iam.mfa_enforcement
  - ref: CC7.2
    title: Security Event Monitoring
    description: >
      The entity monitors system components and the operation of those
      components for anomalies indicative of malicious acts, natural disasters,
      and errors affecting the entity's ability to meet its objectives.
    ocean_control_ids: []
