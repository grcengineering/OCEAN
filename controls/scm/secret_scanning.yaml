id: scm.secret_scanning
name: Secret Scanning and Push Protection
description: >
  Verifies that GitHub secret scanning and push protection are enabled on
  repositories to detect committed secrets (API keys, tokens, passwords)
  and block pushes containing known secret patterns. Also monitors for
  unresolved secret scanning alerts.
threat_mitigated: >
  Credential exposure through committed secrets in source code repositories,
  enabling attackers to gain unauthorized access to external services, cloud
  infrastructure, and internal systems using leaked API keys and tokens.
framework_mappings:
  - framework: soc2
    control: CC6.1
  - framework: iso27001
    control: A.9.4.3
  - framework: nist_csf
    control: PR.DS-5
  - framework: cis_controls
    control: "16.11"
evidence_requirements:
  - secret_scanning_configuration
  - secret_push_test_result
  - secret_scanning_alerts_status
observers:
  - module_id: github.repo_security
  - module_id: github.secret_scanning_alerts
testers:
  - module_id: github.secret_push
evaluation:
  cel: "effective_count > 0 && ineffective_count == 0 && has_active"
