id: ai-platform.ona_environment_policy
name: Ona Environment Lifecycle and Creation Policy
description: >
  Verifies that development environments are bounded in time, that the built-in
  in-environment web browser is off, and that non-admin members cannot create
  blank environments with no Git or URL initializer.
  An Ona environment holds cloned source, mounted secrets, and a live agent
  session, so these three settings together decide how long that exposure lasts,
  what egress it carries, and whether anything reviewable stands behind it.
  The zero-duration inversion is the trap this control exists to catch. Ona's
  duration fields read backwards from intuition: `maximumEnvironmentTimeout` must
  be "0s (no limit) or at least 1800s", `maximumEnvironmentLifetime` "0 means no
  maximum lifetime", `deleteArchivedEnvironmentsAfter` "0 means no automatic
  deletion". A hardening script that zeroes these fields WEAKENS the
  organization, so ONA-3.03 rejects a present-but-zero duration as firmly as an
  absent one, and additionally requires
  `maximumEnvironmentLifetimeStrict` — without it a lifetime bound is advisory,
  since the flag is what blocks a past-lockdown environment from starting.
  Deliberately not asserted: retention. `archiveEnvironmentsAfter` is
  Enterprise-only and constrained to whole days, and both retention fields are
  legitimately long in some organizations, so they are collected as evidence
  rather than judged. Also not asserted: `membersRequireProjects`, the stricter
  sibling of `disableFromScratch` — an organization may legitimately allow ad-hoc
  Git-initialised environments, so failing it would flag a defensible shape.

  SCOPE CEILING — read before treating this control as full coverage.
  Three parts of Ona's hardening surface are invisible to every control-plane
  read. (1) Dotfiles: there is no organization policy AND no admin visibility —
  `UserService/GetDotfilesConfiguration` carries no `userId` field, so it returns
  only the caller's own repository, while a member's dotfiles auto-execute at
  environment start. (2) Automation guardrails (HTH ona:2.5) have ZERO API
  surface, verified across 45 organization, 18 environment-automation, 17
  workflow and 16 project reference pages. (3) What actually runs inside an
  environment — image contents, installed tooling, agent behaviour at runtime —
  is not a control-plane fact at all. Audit logs (`EventService/ListAuditLogs`)
  and webhooks (`WebhookService/ListWebhooks`) additionally answer HTTP 400
  `failed_precondition` on non-Enterprise organizations, so the monitoring band
  cannot be observed at every plan. A passing result is evidence about the
  organization's DECLARED POLICY, not about environment runtime behaviour.
  ABSTENTION — every ONA-* check pairs a compliance verdict with a readability
  discriminator, and the verdict abstains (evaluates Effective, asserting
  nothing) whenever the read failed. Control-level evaluation is not fooled by
  that, because the readability assertion itself reports Ineffective on an
  unreadable organization, so `ineffective_count == 0` still fails. Read an
  individual check's rows as a pair; a lone passing verdict is not an
  attestation.
  INVOCATION — this control resolves under `--target '*'`, not `--target ona`.
  Its observers are YAML checks registered under their own ids (ONA-*), and
  target_matches_module splits a module_id on '.' and compares the first
  segment, so "ONA-1" is never "ona". This is a property of the YAML-check
  namespace, not of Ona: BK-*, GH-*, OKTA-*, SLACK-* and VERCEL-* behave
  identically. The shipped controls that DO match a vendor target reference
  native Rust modules (okta.mfa_policy, github.branch_protection), and no native
  ona observer exists. Using dotted ona.* ids here would satisfy the target
  filter while resolving to nothing, producing a control that looks wired and
  can never return a finding — the worse failure. Closing this properly means
  native Rust observers, or registering YAML checks under a vendor alias.

threat_mitigated: >
  Standing credential-bearing hosts that outlive their task and their owner's
  access, data movement out of the organization through an in-environment browser
  that sits outside managed-endpoint controls, and unreviewed code executing next
  to production credentials in blank environments that carry no repository
  provenance.
framework_mappings:
  - framework: soc2
    control: CC6.1
  - framework: iso27001
    control: A.9.4.2
  - framework: nist_csf
    control: PR.IP-1
  - framework: cis_controls
    control: "4.1"
evidence_requirements:
  - ona_environment_web_browser_policy
  - ona_environment_lifetime_policy
  - ona_environment_creation_policy
observers:
  - module_id: ONA-3.02
  - module_id: ONA-3.03
  - module_id: ONA-3.04
testers: []
evaluation:
  cel: "effective_count > 0 && ineffective_count == 0"
