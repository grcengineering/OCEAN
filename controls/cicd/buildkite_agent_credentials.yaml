id: cicd.buildkite_agent_credentials
name: Buildkite Agent Token and Secret Governance
description: >
  Verifies that cluster agent tokens carry an expiry and an IP allowlist, and
  that cluster secrets carry an access policy.
  Each default is the insecure one: tokens created in the console never expire,
  the token IP allowlist defaults to unrestricted, and a secret with no policy is
  readable by any build in its cluster. Silence is failure for all three, which
  is why they are checked rather than documented.

  SCOPE CEILING — read before treating this control as full coverage.
  Roughly 40% of the Buildkite hardening surface is agent-side configuration
  (no-command-eval, allowed-plugins, redacted-vars, verification-jwks-file,
  pre-bootstrap hooks) and is NOT visible from any Buildkite control plane.
  It can only be attested from the agent host. This control covers the
  control-plane half only; a passing result is not evidence that the agent
  fleet is hardened.
threat_mitigated: >
  Registration of attacker-controlled agents using a leaked, non-expiring agent
  token from an arbitrary network, and retrieval of production credentials by any
  build scheduled into the cluster that holds them.
framework_mappings:
  - framework: soc2
    control: CC6.7
  - framework: iso27001
    control: A.9.2.4
  - framework: nist_csf
    control: PR.AC-1
  - framework: cis_controls
    control: "3.11"
evidence_requirements:
  - buildkite_agent_token_expiry
  - buildkite_agent_token_ip_allowlist
  - buildkite_cluster_secret_policy
observers:
  - module_id: buildkite.agent_token_expiry
  - module_id: buildkite.agent_token_ip_allowlist
  - module_id: buildkite.cluster_secret_policy
testers: []
evaluation:
  cel: "effective_count > 0 && ineffective_count == 0"
