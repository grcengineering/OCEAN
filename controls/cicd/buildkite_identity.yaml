id: cicd.buildkite_identity
name: Buildkite Identity and Session Controls
description: >
  Verifies that the Buildkite organization enforces two-factor authentication for
  all members and is not publicly visible. Read from the GraphQL Organization
  object, where these settings are scalars rather than nested collections.

  SCOPE CEILING — read before treating this control as full coverage.
  Roughly 40% of the Buildkite hardening surface is agent-side configuration
  (no-command-eval, allowed-plugins, redacted-vars, verification-jwks-file,
  pre-bootstrap hooks) and is NOT visible from any Buildkite control plane.
  It can only be attested from the agent host. This control covers the
  control-plane half only; a passing result is not evidence that the agent
  fleet is hardened.
  INVOCATION — this control resolves under `--target '*'`, not `--target buildkite`.
  Its observers are YAML checks registered under their own ids (BK-*), and
  target_matches_module splits a module_id on '.' and compares the first segment,
  so "BK-1" is never "buildkite". This is a property of the YAML-check namespace,
  not of Buildkite: GH-*, OKTA-*, SLACK-* and VERCEL-* behave identically. The
  shipped controls that DO match a vendor target reference native Rust modules
  (okta.mfa_policy, github.branch_protection), and no native buildkite observer
  exists yet. Using dotted buildkite.* ids here would satisfy the target filter
  while resolving to nothing, producing a control that looks wired and can never
  return a finding — the worse failure. Closing this properly means native Rust
  observers, or registering YAML checks under a vendor alias.

threat_mitigated: >
  Account takeover through credential stuffing or phishing against members
  authenticating with a password alone, and reconnaissance of pipeline names,
  build activity and organization structure through a publicly visible
  organization.
framework_mappings:
  - framework: soc2
    control: CC6.1
  - framework: iso27001
    control: A.9.4.2
  - framework: nist_csf
    control: PR.AC-7
  - framework: cis_controls
    control: "6.5"
evidence_requirements:
  - buildkite_org_mfa_setting
  - buildkite_org_visibility_setting
observers:
  - module_id: BK-1.02
  - module_id: BK-4.01
testers: []
evaluation:
  cel: "effective_count > 0 && ineffective_count == 0"
